
<html>
<body>
<nav><a href="index.html">Home</a></nav>
<h1>Search All Facts</h1>
<input id="q" placeholder="Search..." style="width:80%;padding:10px">
<ul id="r"></ul>

<script>
fetch('search.json').then(r=>r.json()).then(d=>{
  q.oninput=()=>r.innerHTML=d
    .filter(x=>x.title.toLowerCase().includes(q.value.toLowerCase()))
    .map(x=>`<li><a href="${x.url}">${x.title}</a></li>`)
    .join('');
});
</script>
</body>
</html>
