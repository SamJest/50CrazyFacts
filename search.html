
<html>
<head>
<title>Search Facts</title>

<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">

<meta charset="UTF-8">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XJEGWMGS"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V2XJEGWMGS');
</script>

</head>
<body>
<h1>Search Facts</h1>
<input id="q" placeholder="Search facts..." style="width:80%;padding:10px">
<ul id="r"></ul>
<script>
fetch('search.json').then(r=>r.json()).then(d=>{
  q.oninput=()=>r.innerHTML=d.filter(x=>x.title.toLowerCase().includes(q.value.toLowerCase()))
    .map(x=>`<li><a href="${x.url}">${x.title}</a></li>`).join('');
});
</script>
</body>
</html>
