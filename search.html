  <a href="index.html">Home</a> | <a href="categories/index.html">Categories</a>
</nav>

<h1>Search Facts</h1>

<input type="text" id="searchBox" placeholder="Search for a fact...">
<ul id="results"></ul>

<script>
let data = [];

async function loadAllFacts() {
  try {
    const response = await fetch('search.json');
    data = await response.json();
  } catch (err) {
    console.error('Error loading search.json:', err);
  }
}

function renderResults(query) {
  const results = data.filter(f => f.join(' ').toLowerCase().includes(query));
  const html = results.map(r => {
    const category = r[6];
    const subject = r[7];
    const title = r[0];
    const urlTitle = title.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    return '<li><a href="' + category + '/' + subject + '/' + urlTitle + '.html">' + title + '</a></li>';
  }).join('');
  document.getElementById('results').innerHTML = html;
}

document.getElementById('searchBox').addEventListener('input', function() {
  const query = this.value.toLowerCase();
  if(!query) {
    document.getElementById('results').innerHTML = '';
    return;
  }
  renderResults(query);
});

loadAllFacts();
</script>

</body>
