
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Facts | 50 Crazy Facts</title>

<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XJEGWMGS"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-V2XJEGWMGS');
</script>

<style>
body { font-family: Arial; padding:20px; background:#f7f7f7; }
h1 { color:#ff5722; }
#searchBox { width: 100%; padding:12px; font-size:1em; margin-bottom:10px; }
#results { list-style:none; padding:0; }
#results li { background:white; margin:5px 0; padding:10px; border-radius:5px; }
#results a { text-decoration:none; font-weight:bold; color:#ff5722; }
</style>
</head>
<body>
<h1>Search Facts</h1>
<input type="text" id="searchBox" placeholder="Search for a fact...">
<ul id="results"></ul>

<script>
let data = [];
fetch('search.json').then(r => r.json()).then(d => data = d);

document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.getElementById('results').innerHTML = data.filter(r => r.join(' ').toLowerCase().includes(q)).slice(0,20)
    .map(r => '<li><a href="categories/'+r[6]+'/'+r[7]+'/'+r[0].toLowerCase().replace(/[^a-z0-9]+/g,"")+'.html">'+r[0]+'</a></li>')
    .join('');
});
</script>
</body>
</html>
