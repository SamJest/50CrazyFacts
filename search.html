<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Facts</title>

<link rel="icon" href="/favicon.ico">


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XJEGWMGS"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-V2XJEGWMGS');
</script>

<style>
body{font-family:Arial,sans-serif;background:#f7f7f7;margin:20px;}
h1{text-align:center;margin-bottom:20px;}
.search-container{max-width:700px;margin:0 auto;text-align:center;}
#searchBox{width:100%;padding:12px;font-size:1.1em;border-radius:8px;border:1px solid #ccc;}
#results{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px;}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,0.08);flex:1 1 220px;text-align:center;transition:transform .25s,box-shadow .25s;}
.card a{text-decoration:none;font-weight:700;color:#222;}
.card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px #ff5722,0 10px 25px #ff5722;}
.badge{display:inline-block;padding:2px 6px;margin:2px;background:#ff5722;color:white;border-radius:4px;font-size:.75em;}
</style>
</head>
<body>

<h1 style="text-align:center;">Search Facts</h1>

<div class="search-container">
  <input type="text" id="searchBox" placeholder="Type a keyword and press Enter...">
</div>

<div id="results"></div>

<script>
// --- Helper to pretty-print category/subject ---
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'').replace(/-/g,' ').split(' ').map((w,i)=>i>0&&small.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

// --- Card HTML ---
function factCard(f){
  const category=f[6]||"uncategorized";
  const subject=f[7]||"general";
  const url="categories/"+category+"/"+subject+"/"+f[0].toLowerCase().replace(/[^a-z0-9]+/g,"-")+".html";
  return '<div class="card">'+
           '<a href="'+url+'">'+f[0]+'</a>'+
           '<div class="meta" style="margin-top:8px;">'+
             '<span class="badge">'+prettyName(category)+'</span> '+
             '<span class="badge">'+prettyName(subject)+'</span>'+
           '</div>'+
         '</div>';
}

// --- Load search.json ---
let allFacts = [];
fetch("search/search.json")
  .then(r=>r.json())
  .then(data=>{
    allFacts = data;
  });

// --- Search on Enter ---
document.getElementById("searchBox").addEventListener("keypress", function(e){
  if(e.key==="Enter"){
    const q = this.value.trim().toLowerCase();
    const resultsContainer = document.getElementById("results");
    resultsContainer.innerHTML = '';
    const matches = allFacts.filter(f => f[0].toLowerCase().includes(q) || f[1].toLowerCase().includes(q));
    if(matches.length === 0){
      resultsContainer.innerHTML = '<p style="text-align:center;width:100%;">No results found</p>';
    } else {
      matches.forEach(f=>resultsContainer.innerHTML += factCard(f));
    }
  }
});
</script>

</body>
</html>
