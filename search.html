<html><body>
<h1>Search Facts</h1>
<input id="q" placeholder="Search facts..." style="width:80%;padding:10px">
<ul id="r"></ul>
<script>
fetch('search.json').then(r=>r.json()).then(d=>{
  q.oninput=()=>r.innerHTML=d.filter(x=>x[0].toLowerCase().includes(q.value.toLowerCase()))
    .map(x=>'<'+'li><a href="'+x[7]+'/'+x[8]+'.html">'+x[0]+'</a></li>').join('');
});
</script>
</body></html>
