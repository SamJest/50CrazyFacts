<style>
  body { font-family: sans-serif; padding: 20px; }
  input { padding: 8px; width: 300px; margin-bottom: 20px; }
  li { margin-bottom: 10px; }
</style>
</head>
<body>
<nav>🔍 <a href="search.html">Search</a> | <a href="categories/index.html">Categories</a></nav>
<h1>Search Facts</h1>
<input type="text" id="searchBox" placeholder="Type to search..."/>
<ul id="results"></ul>

<script>
  const searchBox = document.getElementById('searchBox');
  const results = document.getElementById('results');
  let allFacts = [];

  const cats = ["categories","Technology","Animals"];

  Promise.all(
    cats.map(cat => fetch(cat+'/search.json').then(res => res.json()).catch(()=>[]))
  ).then(arr => { allFacts = arr.flat(); });

  searchBox.addEventListener('input', () => {
    const term = searchBox.value.toLowerCase();
    results.innerHTML = '';
    if(!term) return;
    allFacts.filter(f => f[0].toLowerCase().includes(term))
            .forEach(f => {
              const category = f[6] || 'Misc';
              const subject = f[7] || 'Misc';
              const url = category+'/'+subject+'/'+sanitize(f[0])+'.html';
              const li = document.createElement('li');
              li.innerHTML = '<a href="'+url+'">'+f[0]+'</a>';
              results.appendChild(li);
            });
  });

  function sanitize(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
</script>
</body>
</html>
