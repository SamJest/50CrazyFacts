<style>
body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; }
header { background: #222; color: white; text-align: center; padding: 60px 20px; }
h1 { margin: 0; font-size: 3em; }

.grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin: 20px; }

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  flex: 1 1 220px;
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
  border-top: 4px solid var(--category-color, #555);
}

.card a {
  text-decoration: none;
  font-weight: 700;
  color: #222;
  display: block;
  margin-bottom: 6px;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 0 2 var(--category-color, #555), 0 10px 25px var(--category-color, #555);
}

.badge {
  background: #eee;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: .75em;
  margin: 0 2px;
  display: inline-block;
}

.stats { font-size: 0.85em; color: #666; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>All Categories</h1>
</header>

<div class="grid">
  
      <div class="card" style="--category-color:#ff5722">
        <a href="/categories/animals/index.html">Animals</a>
        <div class="meta">
          <span class="badge">Animals</span>
        </div>
        <div class="stats">📄 0 Facts</div>
      </div>
     <!-- Each card includes badge + total facts -->
</div>

</body>
