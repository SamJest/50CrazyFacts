<style>
body { font-family: Arial,sans-serif; background:#f7f7f7; margin:0; color:#222; line-height:1.5; }
header { background:#222; color:white; text-align:center; padding:60px 20px; position:relative; }
header h1 { margin:0; font-size:3em; }
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:20px; }
.card {
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  flex:1 1 220px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-top 0.25s ease;
  border-top: 5px solid var(--category-color,#555);
}
.card:hover {
  transform: translateY(-6px);
  box-shadow:0 0 0 2 var(--category-color,#555),0 12px 28px rgba(0,0,0,0.12);
}
.card a.title {
  display:block;
  font-weight:700;
  color:#222;
  text-decoration:none;
  margin-bottom:10px;
  font-size:1.2em;
}
.card a.title:hover { color:var(--category-color,#555); }
.card .badge {
  background:#f0f0f0;
  padding:3px 8px;
  border-radius:8px;
  font-size:0.8em;
  margin:4px 0;
  display:inline-block;
}
.card .stats { font-size:0.85em; color:#555; margin-top:8px; }
@media(max-width:600px){
  .grid { flex-direction:column; align-items:center; }
  .card { flex:1 1 100%; }
}
</style>
</head>

<body>

<header>
  <h1>All Categories</h1>
</header>

<div class="grid" id="categoriesGrid">
  
      <div class="card" style="--category-color:#e91e63">
        <a class="title" href="/categories/animals/index.html">
          animals
        </a>
        <div class="badge">1 Subjects</div>
        <div class="stats">Explore facts →</div>
      </div>
    
</div>

</body>
