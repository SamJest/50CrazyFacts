<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Categories</title>

<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<style>
body { font-family: Arial,sans-serif; background:#f7f7f7; margin:0; color:#222; line-height:1.5; scroll-behavior:smooth; }
header { background:#222; color:white; text-align:center; padding:60px 20px; position:relative; }
header h1 { margin:0; font-size:3em; }

.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:20px; }
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 240px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  opacity:0;
}
.card.loaded { opacity:1; }
.card a.title { display:block; font-weight:700; color:#222; text-decoration:none; margin-bottom:10px; font-size:1.2em; transition:color 0.2s; }
.card:hover { transform: translateY(-6px); box-shadow: 0 0 0 2 var(--category-color,#555),0 12px 28px rgba(0,0,0,0.12); }
.card:hover a.title { color:var(--category-color,#555); }
.card .badge { display:inline-block; padding:3px 8px; margin:4px 2px; background:#eee; border-radius:8px; font-size:0.8em; transition: all 0.2s; }
.card:hover .badge { background: var(--category-color,#555); color:white; }
.card .stats { font-size:0.85em; color:#555; margin-top:8px; }
.popular-badge { position:absolute; top:10px; right:10px; background:var(--category-color,#555); color:white; padding:4px 10px; border-radius:14px; font-size:0.75em; font-weight:bold; }

#momentum-box {
  background:white; border-radius:16px; padding:24px; margin:30px auto;
  max-width:700px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.08);
  display:none; transition: transform 0.2s ease, opacity 0.2s ease;
}
#momentum-box a {
  display:inline-block; margin-top:12px; padding:12px 18px;
  border-radius:30px; background:#222; color:white; font-weight:bold; text-decoration:none;
}
#momentum-box a:hover { opacity:0.9; transform:scale(1.03); }

@media(max-width:600px){
  .grid { flex-direction:column; align-items:center; }
  .card { flex:1 1 100%; }
}
</style>
</head>

<body>

<header>
  <h1>All Categories</h1>
</header>

<section id="categoriesGrid" class="grid"></section>

<div id="momentum-box">
  <h2>You might enjoy this category</h2>
  <div id="momentumTitle"></div>
  <a id="momentumLink" href="#">Explore →</a>
</div>

<script>
const categories = [{"name":"animals","url":"/categories/animals/index.html","color":"#9C27B0","subjects":[]}];
const reactionsCache = {};

// UTILITIES
function totalReactionsForCategory(category){
  let total = 0;
  if(category.subjects && category.subjects.length>0){
    for(const sub of category.subjects){
      for(const fact of sub.facts){
        const key = `${category.name}/${sub.name}/${fact.slug}`;
        total += reactionsCache[key]||0;
      }
    }
  }
  return total;
}

function mostPopularReaction(category){
  const counts = {};
  if(category.subjects && category.subjects.length>0){
    for(const sub of category.subjects){
      for(const fact of sub.facts){
        const key = `${category.name}/${sub.name}/${fact.slug}`;
        const val = reactionsCache[key]||0;
        counts['total'] = (counts['total']||0) + val;
      }
    }
  }
  // Just display total reactions as "popular"
  return counts;
}

function createCard(category){
  const div = document.createElement('div');
  div.className='card';
  div.style.setProperty('--category-color', category.color || '#555');
  const factCount = category.subjects?.reduce((a,b)=>a+(b.facts?.length||0),0)||0;
  const reactionTotal = totalReactionsForCategory(category);
  div.innerHTML = `
    <a class="title" href="${category.url}">${category.name}</a>
    <div class="badge">${category.subjects?.length || 0} Subjects</div>
    <div class="badge">${factCount} Facts</div>
    <div class="stats">Total Reactions: ${reactionTotal}</div>
  `;
  div.addEventListener('click', ()=>window.location.href=category.url);
  setTimeout(()=>div.classList.add('loaded'), 50);
  return div;
}

// Render all categories with momentum
function renderCategories(){
  const grid = document.getElementById('categoriesGrid');
  categories.forEach(cat=>{
    const card = createCard(cat);
    grid.appendChild(card);
  });
}

// Momentum box: click random category
document.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const pool = Array.from(document.querySelectorAll('.card')).filter(c=>c!==card);
  if(pool.length===0) return;
  const next = pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('momentumTitle').textContent = next.querySelector('.title').textContent;
  document.getElementById('momentumLink').href = next.querySelector('.title').href;
  document.getElementById('momentum-box').style.display='block';
});

document.addEventListener('DOMContentLoaded', renderCategories);
</script>

</body>
</html>
