<style>
/* PRESERVED CSS — EXACTLY AS BEFORE */
body { font-family: Arial,sans-serif; background:#f7f7f7; margin:0; color:#222; scroll-behavior:smooth; }
header { text-align:center; padding:60px 20px 30px; background:linear-gradient(135deg,#222,#333); color:white; }
header h1 { font-size:2.8em; margin:0 0 10px; }
header p { font-size:1.2em; opacity:0.9; max-width:700px; margin:0 auto; line-height:1.4; }

.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:30px 20px; }
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  cursor:pointer;
  opacity:0;
}
.card.loaded { opacity:1; }

.card a { display:block; font-weight:700; color:#222; text-decoration:none; margin-bottom:10px; font-size:1.15em; transition:color 0.2s; }
.card:hover { transform:translateY(-6px); box-shadow:0 0 0 2 var(--category-color,#ff5722),0 12px 28px rgba(0,0,0,0.12); }
.card:hover a { color: var(--category-color,#ff5722); }

.badge { display:inline-block; padding:4px 8px; margin:2px; border-radius:6px; font-size:.8em; background:#eee; transition:all 0.2s; }
.card:hover .badge { background: var(--category-color,#ff5722); color:white; }

.meta { font-size:0.85em; color:#555; margin-top:6px; }

@media(max-width:600px){ .grid{flex-direction:column;align-items:center;} .card{flex:1 1 100%;} }
</style>
</head>

<body>

<header>
  <h1>All Categories</h1>
  <p>Browse all categories and explore subjects within each.</p>
</header>

<section id="category-grid" class="grid"></section>

<script>

/**************************************************
 DATA FROM GENERATOR
**************************************************/
const CATEGORIES = [{"name":"animals","url":"/categories/animals/index.html","color":"#9C27B0","subjects":[]}];

/**************************************************
 UTIL — Pretty Name
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=>
      i>0 && small.includes(w)
        ? w
        : w.charAt(0).toUpperCase()+w.slice(1)
    )
    .join(' ');
}

/**************************************************
 GLOBAL REACTION SUM PER CATEGORY
**************************************************/
function getCategoryReactionTotal(categorySlug){
  const keyPrefix = 'reactions_';
  let total = 0;

  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key.includes(`_${categorySlug.toLowerCase()}`)){
      const data = JSON.parse(localStorage.getItem(key)) || {};
      total += (data.mindblown||0) + (data.interesting||0) + (data.lol||0) + (data.whoa||0);
    }
  }

  return total;
}

/**************************************************
 CREATE CATEGORY CARD
**************************************************/
function createCategoryCard(category){
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.slug = category.slug;
  div.style.setProperty('--category-color', category.color || '#ff5722');

  const reactionsTotal = getCategoryReactionTotal(category.slug);

  div.innerHTML = `
    <a href="${category.url}">
      ${prettyName(category.title)}
    </a>
    <div class="meta">
      <span class="badge">Subjects: ${category.subjectCount || 1}</span>
      <span class="badge">Facts: ${category.factCount || 1}</span>
      <span class="badge">Reactions: ${reactionsTotal}</span>
    </div>
  `;
  return div;
}

/**************************************************
 POPULATE GRID
**************************************************/
function populateCategoryGrid(categories){
  const container = document.getElementById('category-grid');
  container.innerHTML = '';

  categories.forEach((c,i)=>{
    const card = createCategoryCard(c);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });
}

/**************************************************
 INIT
**************************************************/
if(typeof CATEGORIES !== 'undefined'){
  populateCategoryGrid(CATEGORIES);
}

</script>

</body>
</html>
