<style>
/* RESET & BASE */
body { font-family: 'Inter', Arial, sans-serif; background:#f7f7f7; margin:0; color:#222; scroll-behavior:smooth; }
a { text-decoration:none; color:inherit; }

/* HEADER */
header { text-align:center; padding:60px 20px 30px; background:linear-gradient(135deg,#222,#333); color:white; }
header h1 { font-size:2.8em; margin:0 0 10px; }
header p { font-size:1.2em; opacity:0.9; max-width:800px; margin:0 auto; line-height:1.4; }

/* GRID & CARDS */
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:30px 20px; }
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease;
  cursor:pointer;
  opacity:0;
}
.card.loaded { opacity:1; }

.card a { display:block; font-weight:700; color:#222; margin-bottom:10px; font-size:1.15em; transition:color 0.2s; }
.card:hover { transform:translateY(-6px); box-shadow:0 0 0 2 var(--category-color,#ff5722),0 12px 28px rgba(0,0,0,0.12); }
.card:hover a { color: var(--category-color,#ff5722); }

.badge { display:inline-block; padding:4px 8px; margin:2px; border-radius:6px; font-size:.8em; background:#eee; transition:all 0.2s; }
.card:hover .badge { background: var(--category-color,#ff5722); color:white; }

.meta { font-size:0.85em; color:#555; margin-top:6px; }

/* SEARCH BAR */
#search-container { text-align:center; margin:20px; }
#search-input { padding:10px 16px; font-size:1em; border-radius:12px; border:1px solid #ccc; width:280px; max-width:90%; transition: all 0.2s; }
#search-input:focus { border-color: var(--category-color,#ff5722); outline:none; box-shadow:0 0 6px rgba(255,87,34,0.3); }

/* RESPONSIVE */
@media(max-width:600px){ .grid{flex-direction:column;align-items:center;} .card{flex:1 1 100%;} }
</style>
</head>

<body>

<header>
  <h1>Animals</h1>
  <p>Explore all subjects in "Animals".</p>
</header>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>

<script>
/**************************************************
 DATA FROM GENERATOR
**************************************************/
const ITEMS = [{"title":"aardvarks","slug":"aardvarks","url":"/categories/animals/aardvarks/","color":"#ff5722","category":"animals","factCount":46},{"title":"aardwolfs","slug":"aardwolfs","url":"/categories/animals/aardwolfs/","color":"#ff5722","category":"animals","factCount":45},{"title":"axolotls","slug":"axolotls","url":"/categories/animals/axolotls/","color":"#ff5722","category":"animals","factCount":46},{"title":"aye-ayes","slug":"aye-ayes","url":"/categories/animals/aye-ayes/","color":"#ff5722","category":"animals","factCount":48},{"title":"baboons","slug":"baboons","url":"/categories/animals/baboons/","color":"#ff5722","category":"animals","factCount":46},{"title":"bactrian-camel","slug":"bactrian-camel","url":"/categories/animals/bactrian-camel/","color":"#ff5722","category":"animals","factCount":46},{"title":"capybaras","slug":"capybaras","url":"/categories/animals/capybaras/","color":"#ff5722","category":"animals","factCount":49},{"title":"cassowary","slug":"cassowary","url":"/categories/animals/cassowary/","color":"#ff5722","category":"animals","factCount":46},{"title":"crows","slug":"crows","url":"/categories/animals/crows/","color":"#ff5722","category":"animals","factCount":48},{"title":"dingos","slug":"dingos","url":"/categories/animals/dingos/","color":"#ff5722","category":"animals","factCount":48},{"title":"earthworms","slug":"earthworms","url":"/categories/animals/earthworms/","color":"#ff5722","category":"animals","factCount":49},{"title":"elephants","slug":"elephants","url":"/categories/animals/elephants/","color":"#ff5722","category":"animals","factCount":49},{"title":"fennec-fox","slug":"fennec-fox","url":"/categories/animals/fennec-fox/","color":"#ff5722","category":"animals","factCount":49},{"title":"ferrets","slug":"ferrets","url":"/categories/animals/ferrets/","color":"#ff5722","category":"animals","factCount":46},{"title":"narwhals","slug":"narwhals","url":"/categories/animals/narwhals/","color":"#ff5722","category":"animals","factCount":33},{"title":"okapids","slug":"okapids","url":"/categories/animals/okapids/","color":"#ff5722","category":"animals","factCount":48},{"title":"pangolins","slug":"pangolins","url":"/categories/animals/pangolins/","color":"#ff5722","category":"animals","factCount":48},{"title":"platypuses","slug":"platypuses","url":"/categories/animals/platypuses/","color":"#ff5722","category":"animals","factCount":49},{"title":"red-pandas","slug":"red-pandas","url":"/categories/animals/red-pandas/","color":"#ff5722","category":"animals","factCount":49},{"title":"sloths","slug":"sloths","url":"/categories/animals/sloths/","color":"#ff5722","category":"animals","factCount":49},{"title":"tarsiers","slug":"tarsiers","url":"/categories/animals/tarsiers/","color":"#ff5722","category":"animals","factCount":49}];

/**************************************************
 UTILITIES
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(item){
  const div = document.createElement('div');
  div.className='card';
  div.dataset.slug = item.slug;
  div.dataset.title = item.title.toLowerCase();
  div.style.setProperty('--category-color', item.color || '#ff5722');

  div.innerHTML = `
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${item.factCount || 1}</span>
    </div>
  `;
  return div;
}

/**************************************************
 POPULATE GRID
**************************************************/
function populateGrid(items){
  const container = document.getElementById('items-grid');
  container.innerHTML='';
  items.forEach((item,i)=>{
    const card = createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });
}

/**************************************************
 SEARCH / FILTER
**************************************************/
function filterCards(){
  const query = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const title = card.dataset.title;
    card.style.display = title.includes(query)? 'block':'none';
  });
}

/**************************************************
 INIT
**************************************************/
if(typeof ITEMS!=='undefined'){
  populateGrid(ITEMS);
}
</script>

</body>
</html>
