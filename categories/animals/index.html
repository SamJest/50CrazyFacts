function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'').replace(/-/g,' ').split(' ').map((w,i)=>i>0&&small.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

function createCard(subject){
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.slug = subject.slug;
  div.style.setProperty('--category-color', subject.color || '#ff5722');
  div.innerHTML = `
    <a href="${subject.url}">${prettyName(subject.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${subject.factCount || 0}</span>
      <span class="badge">Reactions: ${subject.reactionsTotal || 0}</span>
    </div>
  `;
  return div;
}

function populateGrid(subjects){
  const container = document.getElementById('subjects-grid');
  container.innerHTML = '';
  subjects.forEach((s,i)=>{
    const card = createCard(s);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });
}

function setupMomentum(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', e=>{
      const all = Array.from(document.querySelectorAll('.card'));
      const pool = all.filter(c=>c!==card);
      if(pool.length===0) return;
      const next = pool[Math.floor(Math.random()*pool.length)];
      document.getElementById('momentumTitle').textContent = next.querySelector('a').textContent;
      document.getElementById('momentumLink').href = next.querySelector('a').href;
      document.getElementById('momentum-box').style.display='block';
    });
  });
}
