/* PRETTY NAME */

function prettyName(slug){
  return slug.replace(/-/g,' ')
             .replace(/\b\w/g,l=>l.toUpperCase());
}

/* CREATE CARD */

function createCard(fact){

  const div=document.createElement('div');
  div.className='card';

  if(fact.reactions>50){
    div.innerHTML+=`<div class="badge">Trending</div>`;
  }

  div.innerHTML+=`
    <a href="${fact.url}">
      ${prettyName(fact.title)}
    </a>
    <div class="reaction-count">
      👍 ${fact.reactions.toLocaleString()}
    </div>
  `;

  return div;
}

/* POPULATE */

function populateGrid(facts){

  const container=
    document.getElementById('subject-grid');

  container.innerHTML='';

  facts.forEach((f,i)=>{
    const card=createCard(f);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*40);
  });

  setupMomentum();
}

/* SHUFFLE */

function shuffleFacts(){
  SUBJECTS.sort(()=>Math.random()-0.5);
  populateGrid(SUBJECTS);
}

/* MOMENTUM */

function setupMomentum(){

  document.querySelectorAll('.card')
  .forEach(card=>{

    card.addEventListener('click',()=>{

      const pool=[...document.querySelectorAll('.card')]
        .filter(c=>c!==card);

      if(!pool.length)return;

      const next=
        pool[Math.floor(Math.random()*pool.length)];

      document.getElementById('momentumTitle')
        .textContent=
        next.querySelector('a').textContent;

      document.getElementById('momentumLink')
        .href=
        next.querySelector('a').href;

      document.getElementById('momentum-box')
        .style.display='block';
    });

  });
}

/* PROGRESS BAR */

window.addEventListener('scroll',()=>{

  const winScroll=
    document.documentElement.scrollTop;

  const height=
    document.documentElement.scrollHeight-
    document.documentElement.clientHeight;

  document.getElementById('progress').style.width=
    (winScroll/height)*100+'%';
});

/* BACK TO TOP */

const topBtn=document.getElementById('backToTop');

window.addEventListener('scroll',()=>{
  topBtn.style.display=
    window.scrollY>400?'block':'none';
});

topBtn.onclick=()=>
  window.scrollTo({top:0,behavior:'smooth'});

/* INIT */

populateGrid(SUBJECTS);
