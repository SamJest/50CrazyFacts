ism-spikes-during-hunting.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Night Vision Rivals Military Goggles","slug":"tarsiers-night-vision-rivals-military-goggles","url":"/categories/animals/tarsiers/tarsiers-night-vision-rivals-military-goggles.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Pupils Expand Exceptionally Fast","slug":"tarsiers-pupils-expand-exceptionally-fast","url":"/categories/animals/tarsiers/tarsiers-pupils-expand-exceptionally-fast.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Spine Acts Like a Spring Coil","slug":"tarsiers-spine-acts-like-a-spring-coil","url":"/categories/animals/tarsiers/tarsiers-spine-acts-like-a-spring-coil.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Tail Acts as a Counterbalance Rod","slug":"tarsiers-tail-acts-as-a-counterbalance-rod","url":"/categories/animals/tarsiers/tarsiers-tail-acts-as-a-counterbalance-rod.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Teeth Are Built for Pure Carnivory","slug":"tarsiers-teeth-are-built-for-pure-carnivory","url":"/categories/animals/tarsiers/tarsiers-teeth-are-built-for-pure-carnivory.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Teeth Are Designed for Carnivory","slug":"tarsiers-teeth-are-designed-for-carnivory","url":"/categories/animals/tarsiers/tarsiers-teeth-are-designed-for-carnivory.html","color":"#ff5722","category":"animals","factCount":1},{"title":"Tarsiers’ Teeth Are Sharp and Specialized","slug":"tarsiers-teeth-are-sharp-and-specialized","url":"/categories/animals/tarsiers/tarsiers-teeth-are-sharp-and-specialized.html","color":"#ff5722","category":"animals","factCount":1},{"title":"The Night Vision Arms Race Tarsiers Accidentally Won Tarsiers don’t just see in the dark — they dominate it. Their night vision borders on the absurd. When scientists first measured tarsier ocular sensitivity, the results seemed exaggerated, almost theatrical — until repeated trials confirmed it. Each eyeball is so large that it rivals the size of its own brain, a biological gamble that pays off spectacularly in low-light hunting. Unlike many nocturnal mammals that rely heavily on smell or whisker feedback, tarsiers operate like living telescopes, scanning the forest with hyper-focused visual acuity. Their retinas are packed with rod cells, the photoreceptors responsible for light detection, allowing them to perceive movement in near-total darkness. This adaptation likely evolved in dense Southeast Asian rainforests where moonlight barely pierces the canopy. Imagine trying to spot a single moth flapping 20 feet away in pitch blackness — that’s routine for a tarsier. Even more impressive, their eyes lack a reflective tapetum lucidum layer seen in cats, meaning their night vision relies purely on raw sensitivity rather than light reflection. Evolution essentially built them oversized biological lenses. Researchers studying primate sensory trade-offs often cite tarsiers as the extreme endpoint of vision specialization. The cost? Those giant eyes can’t rotate, forcing the head to do all the scanning. It’s a perfect example of evolutionary overengineering that works brilliantly — but only within a narrow ecological niche. This visual supremacy allows tarsiers to occupy a predator role unusual for such a small primate. They hunt fast, evasive insects that other nocturnal mammals struggle to track. By monopolizing this visual niche, they avoid direct competition with bats and rodents. Their success illustrates how extreme specialization can outperform generalist survival strategies. In conservation terms, this also makes them fragile. Destroy the dark forest canopy, and their evolutionary advantage collapses. Artificial light pollution alone can disrupt their hunting efficiency. Their night vision is not just impressive — it’s habitat-dependent. Did you know a tarsier’s eyes are so large they can’t move them at all? Instead, the animal rotates its head like an owl to scan the night. Animals Tarsiers Nature Ecology & Evolution https://www.nature.com/articles/s41559-018-0680-7 The Venomous Primate That Shouldn’t Exist Tarsiers are one of the only venomous primates on Earth — a sentence that sounds fictional but isn’t. For decades, primates were considered entirely non-venomous, a neat evolutionary boundary separating them from reptiles and certain mammals. Then researchers examining Philippine tarsiers noticed something odd: specialized salivary glands linked to toxic protein secretion. Laboratory analysis confirmed the saliva contains compounds capable of immobilizing prey. This venom isn’t delivered through fangs like a snake but via a bite that introduces toxic saliva into wounds. It’s primarily used on insects and small vertebrates, accelerating subdual after capture. The discovery stunned evolutionary biologists because venom systems are metabolically expensive and rare among mammals. Why would such a tiny primate evolve one? The prevailing theory points to energy efficiency — venom reduces the need for prolonged struggle, conserving calories. In dense jungles where prey escape easily, this provides a measurable survival advantage. It also hints at an ancient evolutionary experiment in primate weaponization that never widely spread. The system is mild compared to snake venom but potent relative to body size. Its existence reshapes how scientists think about primate defensive and predatory evolution. In ecological terms, venom expands the prey range tarsiers can safely hunt. It allows them to target animals that might otherwise injure them. This elevates their role from insectivore to micro-predator. The ripple effect influences insect population control in their habitats. The discovery also fuels biomedical interest. Venom proteins often inspire pharmaceutical research. Even obscure primates can influence drug developmen /**************************************************
 UTILITIES
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(item){
  const div = document.createElement('div');
  div.className='card';
  div.dataset.slug = item.slug;
  div.dataset.title = (item.title||'').toLowerCase();
  div.dataset.category = item.category || '';
  div.style.setProperty('--category-color', item.color || '#ff5722');

  div.innerHTML = `
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${item.factCount || 1}</span>
    </div>
    <div class="fact-preview" role="tooltip" aria-label="Random fact preview"></div>
  `;
  return div;
}

/**************************************************

**************************************************/
function populateGrid(items){
  const container = document.getElementById('items-grid');
  container.innerHTML='';
  items.forEach((item,i)=>{
    const card = createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });

  // Quick Jump letters
  const letters = [...new Set(items.map(it=>(it.title||'')[0].toUpperCase()))].sort();
  const quickJump = document.getElementById('quickJump');
  quickJump.innerHTML = 'Jump to: ' + letters.map(l=>`<a href="#" data-letter="${l}" aria-label="Jump to ${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const letter = a.dataset.letter.toLowerCase();
      const target = Array.from(container.children).find(c=>c.dataset.title.startsWith(letter));
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'start'});
        // Highlight target briefly
        target.style.transition='background 0.3s';
        const original = target.style.background;
        target.style.background='rgba(255,235,59,0.2)';
        setTimeout(()=>target.style.background=original,600);
      }
    });
  });
}

/**************************************************
 SEARCH / FILTER
**************************************************/
function filterCards(){
  const query = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const title = card.dataset.title;
    if(title.includes(query)){
      card.classList.remove('hidden');
      const a = card.querySelector('a');
      a.innerHTML = a.textContent.replace(
        new RegExp(query,'gi'),
        match => `<mark>${match}</mark>`
      );
    } else {
      card.classList.add('hidden');
    }
  });
}

/**************************************************
 BACK TO TOP VISIBILITY
**************************************************/
const backTop = document.getElementById('back-to-top');
window.addEventListener('scroll', ()=> {
  backTop.style.display = (window.scrollY > 300) ? 'block' : 'none';
});

/**************************************************
 RANDOM FACT ON HOVER
**************************************************/
document.addEventListener('DOMContentLoaded', () => {
  if(!ITEMS || !ITEMS.length) return;

  const cardCache = {};
  document.querySelectorAll('.card').forEach(card => {
    const category = card.dataset.category;
    const slug = card.dataset.slug;
    const previewDiv = card.querySelector('.fact-preview');

    card.addEventListener('mouseenter', async () => {
      if(previewDiv.dataset.loaded) return;
      let url;
      if(window.location.pathname.endsWith('/categories/index.html')){
        url = `/categories/${slug}/`;
      } else {
        url = `/categories/${category}/${slug}/`;
      }

      if(cardCache[url]){
        previewDiv.textContent = cardCache[url];
        previewDiv.dataset.loaded = true;
        return;
      }

      try {
        const resp = await fetch(url+'facts.json');
        if(!resp.ok) return;
        const facts = await resp.json();
        if(!facts.length) return;
        const randomFact = facts[Math.floor(Math.random()*facts.length)];
        const factText = randomFact.FACT_HOOK || randomFact.TITLE || 'No fact available';
        previewDiv.textContent = factText;
        previewDiv.dataset.loaded = true;
        cardCache[url] = factText;
      } catch(e){
        console.warn('Failed to fetch fact preview', e);
      }
    });
  });
});

/**************************************************
 INIT
**************************************************/
if(typeof ITEMS!=='undefined'){
  populateGrid(ITEMS);
}
</script>
