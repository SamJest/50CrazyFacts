<style>
/* RESET & BASE */
body { font-family: 'Inter', Arial, sans-serif; background:#f7f7f7; margin:0; color:#222; scroll-behavior:smooth; }
a { text-decoration:none; color:inherit; }

/* HEADER */
header {
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position: sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
header h1 { font-size:2.8em; margin:0 0 10px; }
header p { font-size:1.2em; opacity:0.9; max-width:800px; margin:0 auto; line-height:1.4; }

/* BREADCRUMB */
.breadcrumb {
  text-align:center;
  font-size:0.9em;
  margin: 10px 0 20px;
  color:#555;
}
.breadcrumb a { color:#ff5722; text-decoration:none; transition: color 0.2s; }
.breadcrumb a:hover { text-decoration:underline; color:#ff784e; }

/* QUICK JUMP */
.quick-jump { text-align:center; margin:10px 0 20px; font-size:0.9em; }
.quick-jump a { color:#007acc; margin:0 5px; text-decoration:none; transition: all 0.2s; }
.quick-jump a:hover { text-decoration:underline; transform: scale(1.05); }

/* GRID & CARDS */
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:30px 20px; }
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease, filter 0.3s ease;
  cursor:pointer;
  opacity:0;
}
.card.loaded { opacity:1; }
.card.hidden { opacity:0; pointer-events:none; transform: scale(0.95); }

.card a { display:block; font-weight:700; color:#222; margin-bottom:10px; font-size:1.15em; transition:color 0.2s; }
.card:hover { transform:translateY(-6px); box-shadow:0 0 0 2 var(--category-color,#ff5722),0 12px 28px rgba(0,0,0,0.12); }
.card:hover a { color: var(--category-color,#ff5722); }

/* Alternating backgrounds */
.grid .card:nth-child(odd) { background:#fff; }
.grid .card:nth-child(even) { background:#fdfdfd; }

.badge {
  display:inline-block;
  padding:4px 8px;
  margin:2px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
  transition:all 0.2s, transform 0.2s;
}
.card:hover .badge { background: var(--category-color,#ff5722); color:white; transform: scale(1.05); }

.meta { font-size:0.85em; color:#555; margin-top:6px; }

/* RANDOM FACT PREVIEW */
.card .fact-preview {
  display:none;
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
  padding:12px;
  font-size:0.85em;
  color:#333;
  z-index:200;
}
.card:hover .fact-preview { display:block; }

/* SEARCH BAR */
#search-container { text-align:center; margin:20px; }
#search-input { padding:10px 16px; font-size:1em; border-radius:12px; border:1px solid #ccc; width:280px; max-width:90%; transition: all 0.2s; }
#search-input:focus { border-color: var(--category-color,#ff5722); outline:none; box-shadow:0 0 6px rgba(255,87,34,0.3); }

/* BACK TO TOP */
#back-to-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff5722;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 1000;
  display:none;
}

/* RESPONSIVE */
@media(max-width:600px){ 
  .grid{flex-direction:column;align-items:center;} 
  .card{flex:1 1 100%;} 
}
</style>
</head>

<body id="top">

<header>
  <h1>Food And Drink</h1>
  <p>Explore all subjects in "Food And Drink".</p>
</header>

<nav class="breadcrumb">
  <a href="/index.html">Home</a> &gt; <span>Food And Drink</span>
</nav>

<div class="quick-jump" id="quickJump"></div>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>

<a href="#top" id="back-to-top">↑ Back to Top</a>

<script>
/**************************************************
 DATA FROM GENERATOR
**************************************************/
const ITEMS = [{"title":"comfort-food","slug":"comfort-food","url":"/categories/food-and-drink/comfort-food/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"fast-food-industry","slug":"fast-food-industry","url":"/categories/food-and-drink/fast-food-industry/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"fermented-foods","slug":"fermented-foods","url":"/categories/food-and-drink/fermented-foods/","color":"#3f51b5","category":"food-and-drink","factCount":54},{"title":"fine-dining","slug":"fine-dining","url":"/categories/food-and-drink/fine-dining/","color":"#3f51b5","category":"food-and-drink","factCount":48},{"title":"food-additives","slug":"food-additives","url":"/categories/food-and-drink/food-additives/","color":"#3f51b5","category":"food-and-drink","factCount":46},{"title":"food-and-nutrition","slug":"food-and-nutrition","url":"/categories/food-and-drink/food-and-nutrition/","color":"#3f51b5","category":"food-and-drink","factCount":45},{"title":"food-culture-and-cuisine","slug":"food-culture-and-cuisine","url":"/categories/food-and-drink/food-culture-and-cuisine/","color":"#3f51b5","category":"food-and-drink","factCount":46},{"title":"food-preservation","slug":"food-preservation","url":"/categories/food-and-drink/food-preservation/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"food-safety","slug":"food-safety","url":"/categories/food-and-drink/food-safety/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"food-trends","slug":"food-trends","url":"/categories/food-and-drink/food-trends/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"functional-food","slug":"functional-food","url":"/categories/food-and-drink/functional-food/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"global-cuisine-from-around-the-world","slug":"global-cuisine-from-around-the-world","url":"/categories/food-and-drink/global-cuisine-from-around-the-world/","color":"#3f51b5","category":"food-and-drink","factCount":51},{"title":"home-cooking","slug":"home-cooking","url":"/categories/food-and-drink/home-cooking/","color":"#3f51b5","category":"food-and-drink","factCount":47},{"title":"macronutrients","slug":"macronutrients","url":"/categories/food-and-drink/macronutrients/","color":"#3f51b5","category":"food-and-drink","factCount":48},{"title":"micronutrients","slug":"micronutrients","url":"/categories/food-and-drink/micronutrients/","color":"#3f51b5","category":"food-and-drink","factCount":0},{"title":"organic-food","slug":"organic-food","url":"/categories/food-and-drink/organic-food/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"plant-based-diets","slug":"plant-based-diets","url":"/categories/food-and-drink/plant-based-diets/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"street-food","slug":"street-food","url":"/categories/food-and-drink/street-food/","color":"#3f51b5","category":"food-and-drink","factCount":46},{"title":"superfoods","slug":"superfoods","url":"/categories/food-and-drink/superfoods/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"sustainable-foods","slug":"sustainable-foods","url":"/categories/food-and-drink/sustainable-foods/","color":"#3f51b5","category":"food-and-drink","factCount":49},{"title":"vegetarian-food","slug":"vegetarian-food","url":"/categories/food-and-drink/vegetarian-food/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"vegan-food","slug":"vegan-food","url":"/categories/food-and-drink/vegan-food/","color":"#3f51b5","category":"food-and-drink","factCount":47},{"title":"whole-foods","slug":"whole-foods","url":"/categories/food-and-drink/whole-foods/","color":"#3f51b5","category":"food-and-drink","factCount":50},{"title":"processed-foods","slug":"processed-foods","url":"/categories/food-and-drink/processed-foods/","color":"#3f51b5","category":"food-and-drink","factCount":45}];

/**************************************************
 UTILITIES
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(item){
  const div = document.createElement('div');
  div.className='card';
  div.dataset.slug = item.slug;
  div.dataset.title = (item.title||'').toLowerCase();
  div.style.setProperty('--category-color', item.color || '#ff5722');

  // Fact preview for hover
  const previewText = item.factPreview || item.FACT_HOOK || '';
  
  div.innerHTML = `
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${item.factCount || 1}</span>
    </div>
    <div class="fact-preview">${previewText}</div>
  `;
  return div;
}

/**************************************************
 POPULATE GRID
**************************************************/
function populateGrid(items){
  const container = document.getElementById('items-grid');
  container.innerHTML='';
  items.forEach((item,i)=>{
    const card = createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });

  // Generate Quick Jump based on first letters
  const letters = [...new Set(items.map(it=> (it.title||'')[0].toUpperCase()))].sort();
  const quickJump = document.getElementById('quickJump');
  quickJump.innerHTML = 'Jump to: ' + letters.map(l=>`<a href="#${l}">${l}</a>`).join(' | ');
}

/**************************************************
 SEARCH / FILTER
**************************************************/
function filterCards(){
  const query = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const title = card.dataset.title;
    if(title.includes(query)){
      card.classList.remove('hidden');
      // Highlight match
      const a = card.querySelector('a');
      a.innerHTML = a.textContent.replace(
        new RegExp(query,'gi'),
        match => `<mark>${match}</mark>`
      );
    } else {
      card.classList.add('hidden');
    }
  });
}

/**************************************************
 BACK TO TOP VISIBILITY
**************************************************/
const backTop = document.getElementById('back-to-top');
window.addEventListener('scroll', ()=> {
  backTop.style.display = (window.scrollY > 300) ? 'block' : 'none';
});

/**************************************************
 INIT
**************************************************/
if(typeof ITEMS!=='undefined'){
  populateGrid(ITEMS);
}
</script>
