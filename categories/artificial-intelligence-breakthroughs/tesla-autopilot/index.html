<style>
:root{
  --bg:#f7f7f7;
  --text:#222;
  --card:#ffffff;
}

body.dark{
  --bg:#121212;
  --text:#f5f5f5;
  --card:#1e1e1e;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  scroll-behavior:smooth;
  transition:.3s ease;
}

a{text-decoration:none;color:inherit;}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position:sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.controls{
  margin-top:15px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  margin:0 5px;
  cursor:pointer;
  font-weight:600;
}

#sortToggle{background:#ff5722;color:white;}
#darkToggle{background:#444;color:white;}

/* BREADCRUMB */
.breadcrumb{
  text-align:center;
  font-size:0.9em;
  margin:10px 0 20px;
}

/* QUICK JUMP */
.quick-jump{
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
}
.quick-jump a{
  margin:0 5px;
  color:#007acc;
  font-weight:500;
}

/* SEARCH */
#search-container{text-align:center;margin:20px;}
#search-input{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}

.section-header{
  width:100%;
  font-size:1.3em;
  font-weight:700;
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:0.25s ease;
  cursor:pointer;
  opacity:0;
  border-top:5px solid var(--category-color,#ff5722);
}

.card.loaded{opacity:1;}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 0 2px var(--category-color,#ff5722),
             0 12px 28px rgba(0,0,0,0.12);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
}

body.dark .badge{background:#333;color:#fff;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  max-width:260px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:0.85em;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-120%);
  transition:opacity .2s ease;
  z-index:999;
}

body.dark #tooltip{
  background:#2b2b2b;
  color:#fff;
}

#tooltip::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color:#fff transparent transparent transparent;
}

body.dark #tooltip::after{
  border-color:#2b2b2b transparent transparent transparent;
}

/* BACK TO TOP */
#back-to-top{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  opacity:0;
  transition:opacity .3s;
}
</style>
</head>
<body id="top">

<header>
  <h1>Tesla Autopilot</h1>
  <p>Explore all facts in "Tesla Autopilot".</p>
  <div id="totalFacts"></div>
  <div class="controls">
    <button id="sortToggle">Sort: A–Z</button>
    <button id="darkToggle">Dark Mode</button>
  </div>
</header>

<nav class="breadcrumb">
  <a href="/index.html">Home</a> &gt; <span>Tesla Autopilot</span>
</nav>

<div class="quick-jump" id="quickJump"></div>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>
<div id="tooltip"></div>

<a href="#top" id="back-to-top">↑ Back to Top</a>

or":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In late 2016, Tesla began equipping all new vehicles with an eight-camera hardware suite designed for future full self-driving capability."},{"title":"Knowledge-Driven Fleet Learning 2023 Enabled Tesla Autopilot to Improve from Billions of Miles","slug":"knowledge-driven-fleet-learning-2023-enabled-tesla-autopilot-to-improve-from-billions-of-miles","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/knowledge-driven-fleet-learning-2023-enabled-tesla-autopilot-to-improve-from-billions-of-miles.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"By 2023, Tesla reported that its vehicles had collectively driven billions of miles with Autopilot engaged."},{"title":"Knowledge-Enhanced Map Data 2022 Improved Tesla Autopilot Speed Limit Recognition","slug":"knowledge-enhanced-map-data-2022-improved-tesla-autopilot-speed-limit-recognition","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/knowledge-enhanced-map-data-2022-improved-tesla-autopilot-speed-limit-recognition.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"By 2022, Tesla enhanced Autopilot’s ability to interpret speed limits using both camera vision and map-based data."},{"title":"Quarter-Pounder Recall 2023 Forced Tesla Autopilot Software Adjustments After NHTSA Review","slug":"quarter-pounder-recall-2023-forced-tesla-autopilot-software-adjustments-after-nhtsa-review","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/quarter-pounder-recall-2023-forced-tesla-autopilot-software-adjustments-after-nhtsa-review.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In early 2023, Tesla issued a large-scale software recall affecting more than 360,000 vehicles equipped with Full Self-Driving Beta."},{"title":"Tesla Autopilot 2014 Software Activation Transformed Thousands of Cars Overnight","slug":"tesla-autopilot-2014-software-activation-transformed-thousands-of-cars-overnight","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/tesla-autopilot-2014-software-activation-transformed-thousands-of-cars-overnight.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In October 2014, Tesla activated advanced driver assistance features in thousands of vehicles through a single over-the-air software update."},{"title":"Unified Occupancy Network 2022 Replaced Traditional Object Detection in Tesla Autopilot","slug":"unified-occupancy-network-2022-replaced-traditional-object-detection-in-tesla-autopilot","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/unified-occupancy-network-2022-replaced-traditional-object-detection-in-tesla-autopilot.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In 2022, Tesla shifted from discrete object detection to an occupancy network that predicts free space in three dimensions."},{"title":"United States 2022 NHTSA Investigation Examined Tesla Autopilot Emergency Vehicle Incidents","slug":"united-states-2022-nhtsa-investigation-examined-tesla-autopilot-emergency-vehicle-incidents","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/united-states-2022-nhtsa-investigation-examined-tesla-autopilot-emergency-vehicle-incidents.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In 2022, U.S. safety regulators expanded an investigation into collisions involving Tesla vehicles and parked emergency responders."},{"title":"Urban Lane Change 2021 Allowed Tesla Autopilot to Execute Automated City Merges","slug":"urban-lane-change-2021-allowed-tesla-autopilot-to-execute-automated-city-merges","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/urban-lane-change-2021-allowed-tesla-autopilot-to-execute-automated-city-merges.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In 2021, Tesla expanded automated lane change features to handle more complex urban merge scenarios."},{"title":"XAI-Inspired Neural Net Training 2021 Increased Tesla Autopilot Image Labeling Efficiency","slug":"xai-inspired-neural-net-training-2021-increased-tesla-autopilot-image-labeling-efficiency","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/xai-inspired-neural-net-training-2021-increased-tesla-autopilot-image-labeling-efficiency.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"By 2021, Tesla had built an internal data labeling pipeline to accelerate neural network training for Autopilot perception."},{"title":"Yield-Based Safety Score 2021 Determined Access to Tesla Full Self-Driving Beta","slug":"yield-based-safety-score-2021-determined-access-to-tesla-full-self-driving-beta","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/yield-based-safety-score-2021-determined-access-to-tesla-full-self-driving-beta.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In 2021, Tesla required drivers to earn a quantified Safety Score before granting access to its Full Self-Driving Beta software."},{"title":"YouTube 2023 Footage Analysis Revealed Rapid Iteration of Tesla Autopilot Beta Updates","slug":"youtube-2023-footage-analysis-revealed-rapid-iteration-of-tesla-autopilot-beta-updates","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/youtube-2023-footage-analysis-revealed-rapid-iteration-of-tesla-autopilot-beta-updates.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"By 2023, Tesla Full Self-Driving Beta users were receiving frequent over-the-air updates sometimes weeks apart."},{"title":"Zero-Lidar Strategy 2020 Confirmed Tesla Autopilot Commitment to Camera-Based Perception","slug":"zero-lidar-strategy-2020-confirmed-tesla-autopilot-commitment-to-camera-based-perception","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/zero-lidar-strategy-2020-confirmed-tesla-autopilot-commitment-to-camera-based-perception.html","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":1,"factPreview":"In 2020, Tesla publicly rejected lidar sensors, committing its Autopilot system to a camera-first strategy."}];
let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
