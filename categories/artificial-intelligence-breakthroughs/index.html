<style>
:root{
  --bg:#f7f7f7;
  --text:#222;
  --card:#ffffff;
}

body.dark{
  --bg:#121212;
  --text:#f5f5f5;
  --card:#1e1e1e;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  scroll-behavior:smooth;
  transition:.3s ease;
}

a{text-decoration:none;color:inherit;}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position:sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.controls{
  margin-top:15px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  margin:0 5px;
  cursor:pointer;
  font-weight:600;
}

#sortToggle{background:#ff5722;color:white;}
#darkToggle{background:#444;color:white;}

/* BREADCRUMB */
.breadcrumb{
  text-align:center;
  font-size:0.9em;
  margin:10px 0 20px;
}

/* QUICK JUMP */
.quick-jump{
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
}
.quick-jump a{
  margin:0 5px;
  color:#007acc;
  font-weight:500;
}

/* SEARCH */
#search-container{text-align:center;margin:20px;}
#search-input{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}

.section-header{
  width:100%;
  font-size:1.3em;
  font-weight:700;
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:0.25s ease;
  cursor:pointer;
  opacity:0;
  border-top:5px solid var(--category-color,#ff5722);
}

.card.loaded{opacity:1;}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 0 2px var(--category-color,#ff5722),
             0 12px 28px rgba(0,0,0,0.12);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
}

body.dark .badge{background:#333;color:#fff;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  max-width:260px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:0.85em;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-120%);
  transition:opacity .2s ease;
  z-index:999;
}

body.dark #tooltip{
  background:#2b2b2b;
  color:#fff;
}

#tooltip::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color:#fff transparent transparent transparent;
}

body.dark #tooltip::after{
  border-color:#2b2b2b transparent transparent transparent;
}

/* BACK TO TOP */
#back-to-top{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  opacity:0;
  transition:opacity .3s;
}
</style>
</head>
<body id="top">

<header>
  <h1>Artificial Intelligence Breakthroughs</h1>
  <p>Explore all subjects in "Artificial Intelligence Breakthroughs".</p>
  <div id="totalFacts"></div>
  <div class="controls">
    <button id="sortToggle">Sort: A–Z</button>
    <button id="darkToggle">Dark Mode</button>
  </div>
</header>

<nav class="breadcrumb">
  <a href="/index.html">Home</a> &gt; <span>Artificial Intelligence Breakthroughs</span>
</nav>

<div class="quick-jump" id="quickJump"></div>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>
<div id="tooltip"></div>

<a href="#top" id="back-to-top">↑ Back to Top</a>

<script>
const ITEMS = [{"title":"midjourney","slug":"midjourney","url":"/categories/artificial-intelligence-breakthroughs/midjourney/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":45,"factPreview":"Designers can generate typographic art and visualize lettering styles using AI prompts."},{"title":"deep-blue","slug":"deep-blue","url":"/categories/artificial-intelligence-breakthroughs/deep-blue/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":55,"factPreview":"Chess had long been a benchmark problem in artificial intelligence, making Deep Blue’s victory a measurable research milestone."},{"title":"alphago","slug":"alphago","url":"/categories/artificial-intelligence-breakthroughs/alphago/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":40,"factPreview":"AlphaGo’s real-time decision-making was enabled by custom tensor processing units designed for deep learning tasks."},{"title":"chatgpt","slug":"chatgpt","url":"/categories/artificial-intelligence-breakthroughs/chatgpt/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":45,"factPreview":"Fine-tuning improved ChatGPT’s ability to handle specific tasks like summarization, translation, and Q&A."},{"title":"alphafold","slug":"alphafold","url":"/categories/artificial-intelligence-breakthroughs/alphafold/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":40,"factPreview":"AlphaFold enables identification of existing drugs that can bind newly characterized protein targets rapidly."},{"title":"dall-e","slug":"dall-e","url":"/categories/artificial-intelligence-breakthroughs/dall-e/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":55,"factPreview":"OpenAI implements filters and alignment strategies to prevent harmful or biased image generation."},{"title":"watson","slug":"watson","url":"/categories/artificial-intelligence-breakthroughs/watson/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":45,"factPreview":"Watson Assistant enables businesses to interact with customers through AI-driven chatbots and voice interfaces."},{"title":"stable-diffusion","slug":"stable-diffusion","url":"/categories/artificial-intelligence-breakthroughs/stable-diffusion/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":55,"factPreview":"The open release of Stable Diffusion accelerated global conversations about regulating generative AI technologies."},{"title":"transformer-model","slug":"transformer-model","url":"/categories/artificial-intelligence-breakthroughs/transformer-model/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":60,"factPreview":"Transformers help extract information from biomedical and scientific literature efficiently."},{"title":"bert","slug":"bert","url":"/categories/artificial-intelligence-breakthroughs/bert/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":55,"factPreview":"The model classifies user inputs into intents for better conversational flow."},{"title":"llama","slug":"llama","url":"/categories/artificial-intelligence-breakthroughs/llama/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"Hospitals began adapting a 70 billion parameter language model to analyze clinical text without building one from scratch."},{"title":"gans","slug":"gans","url":"/categories/artificial-intelligence-breakthroughs/gans/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"By 2018, hospitals were training AI systems on synthetic X-ray images generated by adversarial networks to compensate for scarce medical datasets."},{"title":"siri","slug":"siri","url":"/categories/artificial-intelligence-breakthroughs/siri/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"Behind every spoken command was a structured intent definition encoded in developer frameworks."},{"title":"claude","slug":"claude","url":"/categories/artificial-intelligence-breakthroughs/claude/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"In March 2024, a commercial AI model began processing up to 200,000 tokens in a single prompt, reshaping expectations for long-document reasoning."},{"title":"google-assistant","slug":"google-assistant","url":"/categories/artificial-intelligence-breakthroughs/google-assistant/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":45,"factPreview":"In 2022, users could launch select Xbox Cloud Gaming titles using Google Assistant voice commands on supported devices."},{"title":"alexa","slug":"alexa","url":"/categories/artificial-intelligence-breakthroughs/alexa/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"By 2018, households with children were among the fastest adopters of Alexa-enabled devices."},{"title":"tesla-autopilot","slug":"tesla-autopilot","url":"/categories/artificial-intelligence-breakthroughs/tesla-autopilot/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":15,"factPreview":"By 2023, Tesla Full Self-Driving Beta users were receiving frequent over-the-air updates sometimes weeks apart."},{"title":"waymo-driver","slug":"waymo-driver","url":"/categories/artificial-intelligence-breakthroughs/waymo-driver/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":20,"factPreview":"Waymo committed to powering its electric fleet with renewable energy as part of broader sustainability targets."},{"title":"openai-codex","slug":"openai-codex","url":"/categories/artificial-intelligence-breakthroughs/openai-codex/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"A single English sentence was enough for Codex to generate a working web application prototype in under a minute during early demos."},{"title":"ibm-watsonx","slug":"ibm-watsonx","url":"/categories/artificial-intelligence-breakthroughs/ibm-watsonx/","color":"#94f1fc","category":"artificial-intelligence-breakthroughs","factCount":50,"factPreview":"As AI systems gain access to financial records and medical data, a single compromised credential can expose entire model pipelines."}];
let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
