/* GRID & CARDS */
.grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:30px 20px; }
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease, filter 0.3s ease;
  cursor:pointer;
  opacity:0;
}
.card.loaded { opacity:1; }
.card.hidden { opacity:0; pointer-events:none; transform: scale(0.95); }

.card a { display:block; font-weight:700; color:#222; margin-bottom:10px; font-size:1.15em; transition:color 0.2s; }
.card:hover { transform:translateY(-6px); box-shadow:0 0 0 2 var(--category-color,#ff5722),0 12px 28px rgba(0,0,0,0.12); }
.card:hover a { color: var(--category-color,#ff5722); }

/* Alternating backgrounds */
.grid .card:nth-child(odd) { background:#fff; }
.grid .card:nth-child(even) { background:#fdfdfd; }

.badge {
  display:inline-block;
  padding:4px 8px;
  margin:2px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
  transition:all 0.2s, transform 0.2s;
}
.card:hover .badge { background: var(--category-color,#ff5722); color:white; transform: scale(1.05); }

.meta { font-size:0.85em; color:#555; margin-top:6px; }

/* RANDOM FACT PREVIEW */
.card .fact-preview {
  display:none;
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  width:220px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
  padding:12px;
  font-size:0.85em;
  color:#333;
  z-index:200;
}
.card:hover .fact-preview { display:block; }

/* SEARCH BAR */
#search-container { text-align:center; margin:20px; }
#search-input { padding:10px 16px; font-size:1em; border-radius:12px; border:1px solid #ccc; width:280px; max-width:90%; transition: all 0.2s; }
#search-input:focus { border-color: var(--category-color,#ff5722); outline:none; box-shadow:0 0 6px rgba(255,87,34,0.3); }

/* BACK TO TOP */
#back-to-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff5722;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 1000;
  display:none;
}

/* RESPONSIVE */
@media(max-width:600px){ 
  .grid{flex-direction:column;align-items:center;} 
  .card{flex:1 1 100%;} 
}

/**************************************************
 UTILITIES
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(item){
  const div = document.createElement('div');
  div.className='card';
  div.dataset.slug = item.slug;
  div.dataset.title = (item.title||'').toLowerCase();
  div.style.setProperty('--category-color', item.color || '#ff5722');

  // Fact preview for hover
  const previewText = item.factPreview || item.FACT_HOOK || '';
  
  div.innerHTML = `
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${item.factCount || 1}</span>
    </div>
    <div class="fact-preview">${previewText}</div>
  `;
  return div;
}

/**************************************************
 POPULATE GRID
**************************************************/
function populateGrid(items){
  const container = document.getElementById('items-grid');
  container.innerHTML='';
  items.forEach((item,i)=>{
    const card = createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });

  // Generate Quick Jump based on first letters
  const letters = [...new Set(items.map(it=> (it.title||'')[0].toUpperCase()))].sort();
  const quickJump = document.getElementById('quickJump');
  quickJump.innerHTML = 'Jump to: ' + letters.map(l=>`<a href="#${l}">${l}</a>`).join(' | ');
}

/**************************************************
 SEARCH / FILTER
**************************************************/
function filterCards(){
  const query = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const title = card.dataset.title;
    if(title.includes(query)){
      card.classList.remove('hidden');
      // Highlight match
      const a = card.querySelector('a');
      a.innerHTML = a.textContent.replace(
        new RegExp(query,'gi'),
        match => `<mark>${match}</mark>`
      );
    } else {
      card.classList.add('hidden');
    }
  });
}

/**************************************************
 BACK TO TOP VISIBILITY
**************************************************/
const backTop = document.getElementById('back-to-top');
window.addEventListener('scroll', ()=> {
  backTop.style.display = (window.scrollY > 300) ? 'block' : 'none';
});

/**************************************************
 INIT
**************************************************/
if(typeof ITEMS!=='undefined'){
  populateGrid(ITEMS);
}
</script>
