<style>
/* RESET & BASE */
body {
  font-family: 'Inter', Arial, sans-serif;
  background:#f7f7f7;
  margin:0;
  color:#222;
  scroll-behavior:smooth;
}
a { text-decoration:none; color:inherit; }

/* HEADER */
header {
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position: sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
header h1 { font-size:2.8em; margin:0 0 10px; }
header p { font-size:1.2em; opacity:0.9; max-width:800px; margin:0 auto; line-height:1.4; }

/* BREADCRUMB */
.breadcrumb {
  text-align:center;
  font-size:0.9em;
  margin: 10px 0 20px;
  color:#555;
}
.breadcrumb a { color:#ff5722; transition: color 0.2s; }
.breadcrumb a:hover { text-decoration:underline; color:#ff784e; }

/* QUICK JUMP */
.quick-jump {
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
  user-select:none;
}
.quick-jump a {
  color:#007acc;
  margin:0 5px;
  text-decoration:none;
  transition: all 0.2s;
  font-weight:500;
}
.quick-jump a:hover { text-decoration:underline; transform: scale(1.05); cursor:pointer; }

/* GRID & CARDS */
.grid {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}
.card {
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease, filter 0.3s ease, background 0.25s ease;
  cursor:pointer;
  opacity:0;
}
.card.loaded { opacity:1; }
.card.hidden { opacity:0; pointer-events:none; transform: scale(0.95); }

.card a {
  display:block;
  font-weight:700;
  color:#222;
  margin-bottom:10px;
  font-size:1.15em;
  transition:color 0.2s;
}
.card:hover {
  transform:translateY(-6px);
  box-shadow:0 0 0 2 var(--category-color,#ff5722),0 12px 28px rgba(0,0,0,0.12);
  background: linear-gradient(135deg, #fff, #f9f9f9);
}
.card:hover a { color: var(--category-color,#ff5722); }

/* Alternating backgrounds */
.grid .card:nth-child(odd) { background:#fff; }
.grid .card:nth-child(even) { background:#fdfdfd; }

.badge {
  display:inline-block;
  padding:4px 8px;
  margin:2px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
  transition:all 0.2s, transform 0.2s;
}
.card:hover .badge {
  background: var(--category-color,#ff5722);
  color:white;
  transform: scale(1.05);
}

.meta { font-size:0.85em; color:#555; margin-top:6px; }

/* RANDOM FACT PREVIEW TOOLTIP */
.card .fact-preview {
  display:none;
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%) translateY(6px);
  max-width:260px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
  padding:12px;
  font-size:0.85em;
  color:#333;
  z-index:200;
  white-space:normal;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.card:hover .fact-preview {
  display:block;
  opacity:1;
  transform:translateX(-50%) translateY(10px);
}
.card .fact-preview::after {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color: transparent transparent #fff transparent;
}

/* SEARCH BAR */
#search-container { text-align:center; margin:20px; }
#search-input {
  padding:10px 16px;
  font-size:1em;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
  max-width:90%;
  transition: all 0.2s;
}
#search-input:focus {
  border-color: var(--category-color,#ff5722);
  outline:none;
  box-shadow:0 0 6px rgba(255,87,34,0.3);
}

/* BACK TO TOP */
#back-to-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff5722;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 1000;
  display:none;
}

/* RESPONSIVE */
@media(max-width:600px){
  .grid{flex-direction:column;align-items:center;}
  .card{flex:1 1 100%;}
  .card .fact-preview{max-width:90vw;}
}
</style>

<script>

ories/mythology-and-folklore/finnish-mythology/kalevala-meter-shaped-the-finnish-language.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"Lemminkäinen Was Dismembered and Reassembled","slug":"lemminkinen-was-dismembered-and-reassembled","url":"/categories/mythology-and-folklore/finnish-mythology/lemminkinen-was-dismembered-and-reassembled.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"Louhi Was a Villain and a Protector","slug":"louhi-was-a-villain-and-a-protector","url":"/categories/mythology-and-folklore/finnish-mythology/louhi-was-a-villain-and-a-protector.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"Magic Singing Could Control Weather","slug":"magic-singing-could-control-weather","url":"/categories/mythology-and-folklore/finnish-mythology/magic-singing-could-control-weather.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The First Finnish Deities Were Nature Spirits","slug":"the-first-finnish-deities-were-nature-spirits","url":"/categories/mythology-and-folklore/finnish-mythology/the-first-finnish-deities-were-nature-spirits.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The Hero’s Boat Was Made of Magic","slug":"the-heros-boat-was-made-of-magic","url":"/categories/mythology-and-folklore/finnish-mythology/the-heros-boat-was-made-of-magic.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The Kalevala Nearly Had a Different Ending","slug":"the-kalevala-nearly-had-a-different-ending","url":"/categories/mythology-and-folklore/finnish-mythology/the-kalevala-nearly-had-a-different-ending.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The Kalevala Sparked a National Awakening","slug":"the-kalevala-sparked-a-national-awakening","url":"/categories/mythology-and-folklore/finnish-mythology/the-kalevala-sparked-a-national-awakening.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The North Was a Real Place—and a Mythic One","slug":"the-north-was-a-real-placeand-a-mythic-one","url":"/categories/mythology-and-folklore/finnish-mythology/the-north-was-a-real-placeand-a-mythic-one.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The Sampo Was a Magical Money Machine","slug":"the-sampo-was-a-magical-money-machine","url":"/categories/mythology-and-folklore/finnish-mythology/the-sampo-was-a-magical-money-machine.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The Sampo’s Fragments Became Fertile Soil","slug":"the-sampos-fragments-became-fertile-soil","url":"/categories/mythology-and-folklore/finnish-mythology/the-sampos-fragments-became-fertile-soil.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"The World Was Born From a Duck’s Egg","slug":"the-world-was-born-from-a-ducks-egg","url":"/categories/mythology-and-folklore/finnish-mythology/the-world-was-born-from-a-ducks-egg.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"Tuonela Wasn’t Fiery—It Was Cold and Quiet","slug":"tuonela-wasnt-fieryit-was-cold-and-quiet","url":"/categories/mythology-and-folklore/finnish-mythology/tuonela-wasnt-fieryit-was-cold-and-quiet.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1},{"title":"Väinämöinen Was Born Old and Wise","slug":"vinminen-was-born-old-and-wise","url":"/categories/mythology-and-folklore/finnish-mythology/vinminen-was-born-old-and-wise.html","color":"#607d8b","category":"mythology-and-folklore","factCount":1}];

/**************************************************
 UTILITIES
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(item){
  const div = document.createElement('div');
  div.className='card';
  div.dataset.slug = item.slug;
  div.dataset.title = (item.title||'').toLowerCase();
  div.dataset.category = item.category || '';
  div.style.setProperty('--category-color', item.color || '#ff5722');

  div.innerHTML = `
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="meta">
      <span class="badge">Facts: ${item.factCount || 1}</span>
    </div>
    <div class="fact-preview" role="tooltip" aria-label="Random fact preview"></div>
  `;
  return div;
}

/**************************************************
 POPULATE GRID & QUICK JUMP
**************************************************/
function populateGrid(items){
  const container = document.getElementById('items-grid');
  container.innerHTML='';
  items.forEach((item,i)=>{
    const card = createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*50);
  });

  // Quick Jump letters
  const letters = [...new Set(items.map(it=>(it.title||'')[0].toUpperCase()))].sort();
  const quickJump = document.getElementById('quickJump');
  quickJump.innerHTML = 'Jump to: ' + letters.map(l=>`<a href="#" data-letter="${l}" aria-label="Jump to ${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const letter = a.dataset.letter.toLowerCase();
      const target = Array.from(container.children).find(c=>c.dataset.title.startsWith(letter));
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'start'});
        // Highlight target briefly
        target.style.transition='background 0.3s';
        const original = target.style.background;
        target.style.background='rgba(255,235,59,0.2)';
        setTimeout(()=>target.style.background=original,600);
      }
    });
  });
}

/**************************************************
 SEARCH / FILTER
**************************************************/
function filterCards(){
  const query = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const title = card.dataset.title;
    if(title.includes(query)){
      card.classList.remove('hidden');
      const a = card.querySelector('a');
      a.innerHTML = a.textContent.replace(
        new RegExp(query,'gi'),
        match => `<mark>${match}</mark>`
      );
    } else {
      card.classList.add('hidden');
    }
  });
}

/**************************************************
 BACK TO TOP VISIBILITY
**************************************************/
const backTop = document.getElementById('back-to-top');
window.addEventListener('scroll', ()=> {
  backTop.style.display = (window.scrollY > 300) ? 'block' : 'none';
});

/**************************************************
 RANDOM FACT ON HOVER
**************************************************/
document.addEventListener('DOMContentLoaded', () => {
  if(!ITEMS || !ITEMS.length) return;

  const cardCache = {};
  document.querySelectorAll('.card').forEach(card => {
    const category = card.dataset.category;
    const slug = card.dataset.slug;
    const previewDiv = card.querySelector('.fact-preview');

    card.addEventListener('mouseenter', async () => {
      if(previewDiv.dataset.loaded) return;
      let url;
      if(window.location.pathname.endsWith('/categories/index.html')){
        url = `/categories/${slug}/`;
      } else {
        url = `/categories/${category}/${slug}/`;
      }

      if(cardCache[url]){
        previewDiv.textContent = cardCache[url];
        previewDiv.dataset.loaded = true;
        return;
      }

      try {
        const resp = await fetch(url+'facts.json');
        if(!resp.ok) return;
        const facts = await resp.json();
        if(!facts.length) return;
        const randomFact = facts[Math.floor(Math.random()*facts.length)];
        const factText = randomFact.FACT_HOOK || randomFact.TITLE || 'No fact available';
        previewDiv.textContent = factText;
        previewDiv.dataset.loaded = true;
        cardCache[url] = factText;
      } catch(e){
        console.warn('Failed to fetch fact preview', e);
      }
    });
  });
});

/**************************************************
 INIT
**************************************************/
if(typeof ITEMS!=='undefined'){
  populateGrid(ITEMS);
}
</script>
