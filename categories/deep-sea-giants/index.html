<style>
:root{
  --bg:#f7f7f7;
  --text:#222;
  --card:#ffffff;
}

body.dark{
  --bg:#121212;
  --text:#f5f5f5;
  --card:#1e1e1e;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  scroll-behavior:smooth;
  transition:.3s ease;
}

a{text-decoration:none;color:inherit;}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position:sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.controls{
  margin-top:15px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  margin:0 5px;
  cursor:pointer;
  font-weight:600;
}

#sortToggle{background:#ff5722;color:white;}
#darkToggle{background:#444;color:white;}

/* BREADCRUMB */
.breadcrumb{
  text-align:center;
  font-size:0.9em;
  margin:10px 0 20px;
}

/* QUICK JUMP */
.quick-jump{
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
}
.quick-jump a{
  margin:0 5px;
  color:#007acc;
  font-weight:500;
}

/* SEARCH */
#search-container{text-align:center;margin:20px;}
#search-input{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}

.section-header{
  width:100%;
  font-size:1.3em;
  font-weight:700;
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:0.25s ease;
  cursor:pointer;
  opacity:0;
  border-top:5px solid var(--category-color,#ff5722);
}

.card.loaded{opacity:1;}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 0 2px var(--category-color,#ff5722),
             0 12px 28px rgba(0,0,0,0.12);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
}

body.dark .badge{background:#333;color:#fff;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  max-width:260px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:0.85em;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-120%);
  transition:opacity .2s ease;
  z-index:999;
}

body.dark #tooltip{
  background:#2b2b2b;
  color:#fff;
}

#tooltip::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color:#fff transparent transparent transparent;
}

body.dark #tooltip::after{
  border-color:#2b2b2b transparent transparent transparent;
}

/* BACK TO TOP */
#back-to-top{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  opacity:0;
  transition:opacity .3s;
}
</style>
</head>
<body id="top">

<header>
  <h1>Deep Sea Giants</h1>
  <p>Explore all subjects in "Deep Sea Giants".</p>
  <div id="totalFacts"></div>
  <div class="controls">
    <button id="sortToggle">Sort: A–Z</button>
    <button id="darkToggle">Dark Mode</button>
  </div>
</header>

<nav class="breadcrumb">
  <a href="/index.html">Home</a> &gt; <span>Deep Sea Giants</span>
</nav>

<div class="quick-jump" id="quickJump"></div>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>
<div id="tooltip"></div>

<a href="#top" id="back-to-top">↑ Back to Top</a>

<script>
const ITEMS = [{"title":"hunting-strategies-of-deep-sea-giants-that-use-bioluminescence-to-trick-prey","slug":"hunting-strategies-of-deep-sea-giants-that-use-bioluminescence-to-trick-prey","url":"/categories/deep-sea-giants/hunting-strategies-of-deep-sea-giants-that-use-bioluminescence-to-trick-prey/","color":"#7e8384","category":"deep-sea-giants","factCount":50,"factPreview":"Deep-sea squid flash rows of photophores to confuse prey and predators alike."},{"title":"billion-dollar-scandals-involving-deep-sea-giants-and-ocean-mining","slug":"billion-dollar-scandals-involving-deep-sea-giants-and-ocean-mining","url":"/categories/deep-sea-giants/billion-dollar-scandals-involving-deep-sea-giants-and-ocean-mining/","color":"#7e8384","category":"deep-sea-giants","factCount":49,"factPreview":"Small but ferocious deep-sea cookiecutter sharks are captured illegally for specialty markets, generating millions."},{"title":"ancient-microplastics-discovered-inside-deep-sea-giants","slug":"ancient-microplastics-discovered-inside-deep-sea-giants","url":"/categories/deep-sea-giants/ancient-microplastics-discovered-inside-deep-sea-giants/","color":"#7e8384","category":"deep-sea-giants","factCount":48,"factPreview":"Giant clams build their massive shells layer by layer, trapping microplastics like time capsules."},{"title":"transparent-heads-of-deep-sea-giants-that-conceal-deadly-mechanisms","slug":"transparent-heads-of-deep-sea-giants-that-conceal-deadly-mechanisms","url":"/categories/deep-sea-giants/transparent-heads-of-deep-sea-giants-that-conceal-deadly-mechanisms/","color":"#7e8384","category":"deep-sea-giants","factCount":50,"factPreview":"The  has a nearly invisible skull that conceals its deadly feeding mechanism."},{"title":"nuclear-submarine-tests-revealed-the-resilience-of-deep-sea-giants","slug":"nuclear-submarine-tests-revealed-the-resilience-of-deep-sea-giants","url":"/categories/deep-sea-giants/nuclear-submarine-tests-revealed-the-resilience-of-deep-sea-giants/","color":"#7e8384","category":"deep-sea-giants","factCount":45,"factPreview":"Japanese spider crabs endure deep pressure disruptions with armored legs stretching wider than a compact car."},{"title":"cold-war-experiments-targeting-deep-sea-giants-remain-classified","slug":"cold-war-experiments-targeting-deep-sea-giants-remain-classified","url":"/categories/deep-sea-giants/cold-war-experiments-targeting-deep-sea-giants-remain-classified/","color":"#7e8384","category":"deep-sea-giants","factCount":40,"factPreview":"Sonar sweeps were reportedly used to measure the reach of enormous squid tentacles."},{"title":"inflatable-defense-mechanisms-in-deep-sea-giants","slug":"inflatable-defense-mechanisms-in-deep-sea-giants","url":"/categories/deep-sea-giants/inflatable-defense-mechanisms-in-deep-sea-giants/","color":"#7e8384","category":"deep-sea-giants","factCount":40,"factPreview":"Gulper eels can inflate their stomach and trunk to appear monstrous and avoid predation."},{"title":"infrared-vision-capabilities-of-deep-sea-giants","slug":"infrared-vision-capabilities-of-deep-sea-giants","url":"/categories/deep-sea-giants/infrared-vision-capabilities-of-deep-sea-giants/","color":"#7e8384","category":"deep-sea-giants","factCount":35,"factPreview":"Giant squids can sense minute infrared heat from prey over remarkable distances, using the largest eyes in the animal kingdom."},{"title":"bioelectric-signals-from-deep-sea-giants-that-cause-mass-strandings","slug":"bioelectric-signals-from-deep-sea-giants-that-cause-mass-strandings","url":"/categories/deep-sea-giants/bioelectric-signals-from-deep-sea-giants-that-cause-mass-strandings/","color":"#7e8384","category":"deep-sea-giants","factCount":29,"factPreview":"The  emits weak bioelectric signals that may influence collective swimming patterns in the deep sea."},{"title":"heavy-metal-accumulation-in-deep-sea-giants-without-mortality","slug":"heavy-metal-accumulation-in-deep-sea-giants-without-mortality","url":"/categories/deep-sea-giants/heavy-metal-accumulation-in-deep-sea-giants-without-mortality/","color":"#7e8384","category":"deep-sea-giants","factCount":30,"factPreview":"Frilled sharks accumulate cadmium over decades without mortality or obvious stress."}];
let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>

</body>
