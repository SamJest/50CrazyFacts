ificant quantities of charcoal, reshaping surrounding woodland ecosystems."},{"title":"Island of Meroe Hosted Concentrated Urban and Industrial Activity","slug":"island-of-meroe-hosted-concentrated-urban-and-industrial-activity","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/island-of-meroe-hosted-concentrated-urban-and-industrial-activity.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Between the Nile and Atbara rivers, the so-called Island of Meroe became one of the most densely developed regions in ancient Nubia."},{"title":"Jebel Barkal Rock Pinnacle Functioned as Natural Symbol of Divine Kingship","slug":"jebel-barkal-rock-pinnacle-functioned-as-natural-symbol-of-divine-kingship","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/jebel-barkal-rock-pinnacle-functioned-as-natural-symbol-of-divine-kingship.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"A dramatic sandstone pinnacle rising beside Jebel Barkal was interpreted as a physical manifestation of divine authority."},{"title":"Kawa Temple Complex Linked Kushite Kings to Egyptian Amun Worship","slug":"kawa-temple-complex-linked-kushite-kings-to-egyptian-amun-worship","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/kawa-temple-complex-linked-kushite-kings-to-egyptian-amun-worship.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"In the 8th century BCE, Kushite rulers invested heavily in a temple hundreds of miles north to legitimize their claim over Egypt."},{"title":"Kushite Meroitic Script Remains Partially Undeciphered After 2,000 Years","slug":"kushite-meroitic-script-remains-partially-undeciphered-after-2-000-years","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/kushite-meroitic-script-remains-partially-undeciphered-after-2-000-years.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"More than two millennia after its creation, parts of the Kushite writing system still resist full translation."},{"title":"Lion Imagery in Kushite Royal Art Reinforced Military Authority","slug":"lion-imagery-in-kushite-royal-art-reinforced-military-authority","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/lion-imagery-in-kushite-royal-art-reinforced-military-authority.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Across Kushite temples and reliefs, lions appear repeatedly as visual shorthand for royal power and battlefield dominance."},{"title":"Lion Temple at Musawwarat es-Sufra Showcases Unique Kushite Architecture","slug":"lion-temple-at-musawwarat-es-sufra-showcases-unique-kushite-architecture","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/lion-temple-at-musawwarat-es-sufra-showcases-unique-kushite-architecture.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Deep in the desert, the Lion Temple at Musawwarat es-Sufra presents one of the most unusual architectural complexes of ancient Nubia."},{"title":"Meroë Iron Industry Produced Thousands of Tons of Slag by 300 BCE","slug":"mero-iron-industry-produced-thousands-of-tons-of-slag-by-300-bce","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/mero-iron-industry-produced-thousands-of-tons-of-slag-by-300-bce.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"By 300 BCE, the Kingdom of Kush was producing so much iron that entire hills of industrial waste reshaped the landscape around its capital."},{"title":"Meroë Relocation of Capital Shifted Kushite Political Center Around 300 BCE","slug":"mero-relocation-of-capital-shifted-kushite-political-center-around-300-bce","url":"/categories/ancient-civilizations-secrets/kingdom-of-kush/mero-relocation-of-capital-shifted-kushite-political-center-around let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
