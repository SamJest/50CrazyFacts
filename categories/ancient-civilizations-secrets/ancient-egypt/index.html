ns-secrets","factCount":1,"factPreview":"Around 3100 BCE, a carved stone palette recorded the violent consolidation of Upper and Lower Egypt into a single kingdom."},{"title":"Nile Nilometer Taxation System and Flood Measurement","slug":"nile-nilometer-taxation-system-and-flood-measurement","url":"/categories/ancient-civilizations-secrets/ancient-egypt/nile-nilometer-taxation-system-and-flood-measurement.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"For over a millennium, stone stairwells carved along the Nile determined how much tax Egyptians would pay each year."},{"title":"Oxyrhynchus Papyri Discovery of 1897 and Lost Literature","slug":"oxyrhynchus-papyri-discovery-of-1897-and-lost-literature","url":"/categories/ancient-civilizations-secrets/ancient-egypt/oxyrhynchus-papyri-discovery-of-1897-and-lost-literature.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"In 1897, archaeologists excavating an Egyptian rubbish mound uncovered tens of thousands of papyrus fragments preserving forgotten ancient texts."},{"title":"Pi-Ramesses Capital Relocation and Nile Shift circa 1060 BCE","slug":"pi-ramesses-capital-relocation-and-nile-shift-circa-1060-bce","url":"/categories/ancient-civilizations-secrets/ancient-egypt/pi-ramesses-capital-relocation-and-nile-shift-circa-1060-bce.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"A thriving royal capital built by Ramesses II was gradually abandoned after the Nile shifted its course, stranding the city away from major trade routes."},{"title":"Qar Tomb Autobiography Reveals Sixth Dynasty Power Networks","slug":"qar-tomb-autobiography-reveals-sixth-dynasty-power-networks","url":"/categories/ancient-civilizations-secrets/ancient-egypt/qar-tomb-autobiography-reveals-sixth-dynasty-power-networks.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Around 2300 BCE, a provincial governor carved his own career achievements into limestone, quietly exposing how Egypt's Old Kingdom actually functioned beyond the pharaoh."},{"title":"Qubbet el-Hawa Tombs and Aswan Frontier Diplomacy","slug":"qubbet-el-hawa-tombs-and-aswan-frontier-diplomacy","url":"/categories/ancient-civilizations-secrets/ancient-egypt/qubbet-el-hawa-tombs-and-aswan-frontier-diplomacy.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Cliffside tombs overlooking the Nile at Aswan record how Egyptian governors negotiated with Nubia instead of simply conquering it."},{"title":"Ramesseum Grain Storage Complex and Economic Planning","slug":"ramesseum-grain-storage-complex-and-economic-planning","url":"/categories/ancient-civilizations-secrets/ancient-egypt/ramesseum-grain-storage-complex-and-economic-planning.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"The mortuary temple of Ramesses II doubled as a massive grain storage facility capable of supporting thousands during shortages."},{"title":"Rosetta Stone Decree of 196 BCE and Language Decipherment","slug":"rosetta-stone-decree-of-196-bce-and-language-decipherment","url":"/categories/ancient-civilizations-secrets/ancient-egypt/rosetta-stone-decree-of-196-bce-and-language-decipherment.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"In 196 BCE, a single granite slab recorded the same royal decree in three scripts, unknowingly creating the key to unlocking hieroglyphs."},{"title":"Saqqara Serapeum Bull Burial Chambers","slug":"saqqara-serapeum-bull-burial-chambers","url":"/categories/ancient-civilizations-secrets/ancient-egypt/saqqara-serapeum-bull-burial-chambers.html","color":"#8eb58a","category":"ancient-civilizations-secrets","factCount":1,"factPreview":"Underground galleries at Saqqara housed massive granite sarcophagi weighing up to 70 tons for sacred Apis bul let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
