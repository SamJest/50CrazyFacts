<style>
:root{
  --bg:#f7f7f7;
  --text:#222;
  --card:#ffffff;
}

body.dark{
  --bg:#121212;
  --text:#f5f5f5;
  --card:#1e1e1e;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  scroll-behavior:smooth;
  transition:.3s ease;
}

a{text-decoration:none;color:inherit;}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position:sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.controls{
  margin-top:15px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  margin:0 5px;
  cursor:pointer;
  font-weight:600;
}

#sortToggle{background:#ff5722;color:white;}
#darkToggle{background:#444;color:white;}

/* BREADCRUMB */
.breadcrumb{
  text-align:center;
  font-size:0.9em;
  margin:10px 0 20px;
}

/* QUICK JUMP */
.quick-jump{
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
}
.quick-jump a{
  margin:0 5px;
  color:#007acc;
  font-weight:500;
}

/* SEARCH */
#search-container{text-align:center;margin:20px;}
#search-input{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}

.section-header{
  width:100%;
  font-size:1.3em;
  font-weight:700;
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:0.25s ease;
  cursor:pointer;
  opacity:0;
  border-top:5px solid var(--category-color,#ff5722);
}

.card.loaded{opacity:1;}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 0 2px var(--category-color,#ff5722),
             0 12px 28px rgba(0,0,0,0.12);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
}

body.dark .badge{background:#333;color:#fff;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  max-width:260px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:0.85em;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-120%);
  transition:opacity .2s ease;
  z-index:999;
}

body.dark #tooltip{
  background:#2b2b2b;
  color:#fff;
}

#tooltip::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color:#fff transparent transparent transparent;
}

body.dark #tooltip::after{
  border-color:#2b2b2b transparent transparent transparent;
}

/* BACK TO TOP */
#back-to-top{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  opacity:0;
  transition:opacity .3s;
}
</style>
</head>
<body id="top">

<header>
  <h1>Ancient Civilizations Secrets</h1>
  <p>Explore all subjects in "Ancient Civilizations Secrets".</p>
  <div id="totalFacts"></div>
  <div class="controls">
    <button id="sortToggle">Sort: A–Z</button>
    <button id="darkToggle">Dark Mode</button>
  </div>
</header>

<nav class="breadcrumb">

</nav>

<div class="quick-jump" id="quickJump"></div>

<section id="search-container">
  <input type="text" id="search-input" placeholder="Search..." oninput="filterCards()">
</section>

<section id="items-grid" class="grid"></section>
<div id="tooltip"></div>

<a href="#top" id="back-to-top">↑ Back to Top</a>

<script>
const ITEMS = [{"title":"secret-engineering-of-ancient-pyramids","slug":"secret-engineering-of-ancient-pyramids","url":"/categories/ancient-civilizations-secrets/secret-engineering-of-ancient-pyramids/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Before Pythagoras, Egyptians were silently proving triangles work."},{"title":"lost-rituals-of-forgotten-kingdoms","slug":"lost-rituals-of-forgotten-kingdoms","url":"/categories/ancient-civilizations-secrets/lost-rituals-of-forgotten-kingdoms/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"A medieval kingdom treated an entire river as a living oracle that dictated political decisions."},{"title":"mysteries-of-ancient-astronomical-observatories","slug":"mysteries-of-ancient-astronomical-observatories","url":"/categories/ancient-civilizations-secrets/mysteries-of-ancient-astronomical-observatories/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"A Native American earthen circle may have tracked solstices over 1,000 years ago, predating European calendars."},{"title":"underground-cities-and-hidden-passageways","slug":"underground-cities-and-hidden-passageways","url":"/categories/ancient-civilizations-secrets/underground-cities-and-hidden-passageways/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"People once celebrated mass in complete darkness, underground, relying only on lamps and their faith."},{"title":"forbidden-knowledge-of-priesthoods","slug":"forbidden-knowledge-of-priesthoods","url":"/categories/ancient-civilizations-secrets/forbidden-knowledge-of-priesthoods/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Priests knew exactly which chemicals preserved bodies, centuries before modern embalming."},{"title":"hidden-tombs-of-unknown-rulers","slug":"hidden-tombs-of-unknown-rulers","url":"/categories/ancient-civilizations-secrets/hidden-tombs-of-unknown-rulers/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"A king in ancient India built his tomb behind a roaring waterfall to hide it completely."},{"title":"ancient-weapons-and-siege-technologies","slug":"ancient-weapons-and-siege-technologies","url":"/categories/ancient-civilizations-secrets/ancient-weapons-and-siege-technologies/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Roman generals once used live pigs set on fire to terrify enemy elephants."},{"title":"mysterious-scripts-and-undeciphered-writing","slug":"mysterious-scripts-and-undeciphered-writing","url":"/categories/ancient-civilizations-secrets/mysterious-scripts-and-undeciphered-writing/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Before cuneiform, ancient Persia experimented with symbols nobody fully understands today."},{"title":"lost-libraries-and-scrolls","slug":"lost-libraries-and-scrolls","url":"/categories/ancient-civilizations-secrets/lost-libraries-and-scrolls/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"A Tibetan monastery hid thousands of manuscripts in secret caves to evade invaders."},{"title":"sacred-geometry-in-architecture","slug":"sacred-geometry-in-architecture","url":"/categories/ancient-civilizations-secrets/sacred-geometry-in-architecture/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Nazca Lines aren’t just giant doodles—they’re cosmic messages in disguise."},{"title":"royal-intrigues-and-palace-conspiracies","slug":"royal-intrigues-and-palace-conspiracies","url":"/categories/ancient-civilizations-secrets/royal-intrigues-and-palace-conspiracies/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":0,"factPreview":"No facts available"},{"title":"curses-and-protective-spells-of-antiquity","slug":"curses-and-protective-spells-of-antiquity","url":"/categories/ancient-civilizations-secrets/curses-and-protective-spells-of-antiquity/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":54,"factPreview":"Tiny charms aboard massive vessels, protecting sailors from supernatural—and very real—threats!"},{"title":"unexplained-disappearances-of-civilizations","slug":"unexplained-disappearances-of-civilizations","url":"/categories/ancient-civilizations-secrets/unexplained-disappearances-of-civilizations/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Tikal, a Maya metropolis, was suddenly abandoned despite monumental pyramids and thriving trade networks."},{"title":"advanced-water-management-systems","slug":"advanced-water-management-systems","url":"/categories/ancient-civilizations-secrets/advanced-water-management-systems/","color":"#1f73ea","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Romans made hot water flow under your feet before modern plumbing."}];
let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip=document.getElementById('tooltip');
  tooltip.textContent=this.dataset.preview;
  tooltip.style.opacity=1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip=document.getElementById('tooltip');
  tooltip.style.left=e.pageX+'px';
  tooltip.style.top=e.pageY+'px';
}

function hideTooltip(){
  document.getElementById('tooltip').style.opacity=0;
}

document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
