<style>
:root{
  --bg:#f7f7f7;
  --text:#222;
  --card:#ffffff;
}

body.dark{
  --bg:#121212;
  --text:#f5f5f5;
  --card:#1e1e1e;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:var(--text);
  scroll-behavior:smooth;
  transition:.3s ease;
}

a{text-decoration:none;color:inherit;}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px 30px;
  background:linear-gradient(135deg,#222,#333);
  color:white;
  position:sticky;
  top:0;
  z-index:500;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.controls{
  margin-top:15px;
}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  margin:0 5px;
  cursor:pointer;
  font-weight:600;
}

#sortToggle{background:#ff5722;color:white;}
#darkToggle{background:#444;color:white;}

/* BREADCRUMB */
.breadcrumb{
  text-align:center;
  font-size:0.9em;
  margin:10px 0 20px;
}

/* QUICK JUMP */
.quick-jump{
  text-align:center;
  margin:10px 0 20px;
  font-size:0.9em;
}
.quick-jump a{
  margin:0 5px;
  color:#007acc;
  font-weight:500;
}

/* SEARCH */
#search-container{text-align:center;margin:20px;}
#search-input{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:280px;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  margin:30px 20px;
}

.section-header{
  width:100%;
  font-size:1.3em;
  font-weight:700;
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  flex:1 1 260px;
  text-align:center;
  position:relative;
  transition:0.25s ease;
  cursor:pointer;
  opacity:0;
  border-top:5px solid var(--category-color,#ff5722);
}

.card.loaded{opacity:1;}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 0 2px var(--category-color,#ff5722),
             0 12px 28px rgba(0,0,0,0.12);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:.8em;
  background:#eee;
}

body.dark .badge{background:#333;color:#fff;}

/* TOOLTIP */
#tooltip{
  position:fixed;
  max-width:260px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  color:#222;
  font-size:0.85em;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-120%);
  transition:opacity .2s ease;
  z-index:999;
}

body.dark #tooltip{
  background:#2b2b2b;
  color:#fff;
}

#tooltip::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border-width:6px;
  border-style:solid;
  border-color:#fff transparent transparent transparent;
}

body.dark #tooltip::after{
  border-color:#2b2b2b transparent transparent transparent;
}

/* BACK TO TOP */
#back-to-top{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  opacity:0;
  transition:opacity .3s;
}

gdom","slug":"nubian-kingdom","url":"/categories/ancient-civilizations-secrets/nubian-kingdom/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Around 2250 BCE, an Egyptian official recorded a trade journey of roughly 1,200 kilometers into Nubian-controlled territory."},{"title":"ancient-egypt","slug":"ancient-egypt","url":"/categories/ancient-civilizations-secrets/ancient-egypt/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Around 2350 BCE, an Egyptian pharaoh filled the interior walls of his pyramid with thousands of carved spells to guide his soul after death."},{"title":"aksumite-empire","slug":"aksumite-empire","url":"/categories/ancient-civilizations-secrets/aksumite-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Greek geographic writings from the Ptolemaic era mention commercial activity along the Horn of Africa centuries before Aksum’s rise."},{"title":"shang-dynasty","slug":"shang-dynasty","url":"/categories/ancient-civilizations-secrets/shang-dynasty/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":55,"factPreview":"Shang kings used human sacrifices during rituals to demonstrate power and appease ancestors."},{"title":"harappan-civilization","slug":"harappan-civilization","url":"/categories/ancient-civilizations-secrets/harappan-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Harappan farmers operated across semi-arid zones where seasonal rainfall variability demanded adaptive crop strategies."},{"title":"indus-valley-civilization","slug":"indus-valley-civilization","url":"/categories/ancient-civilizations-secrets/indus-valley-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Artifacts resembling Mesopotamian Ubaid culture objects have been found in Indus settlements dating back to the 3rd millennium BCE."},{"title":"babylonian-empire","slug":"babylonian-empire","url":"/categories/ancient-civilizations-secrets/babylonian-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Estimates suggest 6th century BC Babylon may have housed more than 100,000 residents within its fortified walls."},{"title":"assyrian-empire","slug":"assyrian-empire","url":"/categories/ancient-civilizations-secrets/assyrian-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"In 681 BCE, rebuilding a temple tower became a calculated act of political survival for a new Assyrian king."},{"title":"hittite-empire","slug":"hittite-empire","url":"/categories/ancient-civilizations-secrets/hittite-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":55,"factPreview":"Before the Hittite Empire reached its height, rebellions like the revolt at Zalpa exposed fragile early authority."},{"title":"elamite-kingdom","slug":"elamite-kingdom","url":"/categories/ancient-civilizations-secrets/elamite-kingdom/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":45,"factPreview":"By the 25th century BCE, inscriptions from Lagash record armed conflict with Elamite forces."},{"title":"phoenicians","slug":"phoenicians","url":"/categories/ancient-civilizations-secrets/phoenicians/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"By the 9th century BCE, Phoenician settlers transformed Kition in Cyprus into a copper export powerhouse."},{"title":"minoan-civilization","slug":"minoan-civilization","url":"/categories/ancient-civilizations-secrets/minoan-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Around 1450 BCE, a palace fire at Zakros baked clay tablets hard enough to preserve administrative records for millennia."},{"title":"olmec-civilization","slug":"olmec-civilization","url":"/categories/ancient-civilizations-secrets/olmec-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Geological studies trace some Olmec jade artifacts to deposits near the Motagua River system active by 1000 BCE."},{"title":"mycenaean-civilization","slug":"mycenaean-civilization","url":"/categories/ancient-civilizations-secrets/mycenaean-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Imported Mycenaean pottery found at Kourion in Cyprus confirms structured 13th century BCE exchange across the eastern Mediterranean."},{"title":"maya-civilization","slug":"maya-civilization","url":"/categories/ancient-civilizations-secrets/maya-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":55,"factPreview":"In 1697, the Itza capital of Zacpeten became one of the last independent Maya strongholds to fall to Spanish forces."},{"title":"aztec-empire","slug":"aztec-empire","url":"/categories/ancient-civilizations-secrets/aztec-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":40,"factPreview":"By the 15th century, Aztec military prestige depended on admission into elite warrior orders such as the Eagle and Jaguar societies."},{"title":"norte-chico","slug":"norte-chico","url":"/categories/ancient-civilizations-secrets/norte-chico/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":55,"factPreview":"Stone reliefs at Vichama depict emaciated figures, suggesting social stress near the end of Norte Chico dominance."},{"title":"inca-empire","slug":"inca-empire","url":"/categories/ancient-civilizations-secrets/inca-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"In narrow Andean canyons, the Inca carved terraces that transformed steep rock faces into productive farmland."},{"title":"wari-empire","slug":"wari-empire","url":"/categories/ancient-civilizations-secrets/wari-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":47,"factPreview":"Empire-wide labor drafts allowed urban centers, terraces, and roads to be built efficiently across hundreds of kilometers."},{"title":"moche-civilization","slug":"moche-civilization","url":"/categories/ancient-civilizations-secrets/moche-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":49,"factPreview":"Archaeological evidence shows Moche engineers altered canal courses to mitigate flood risk during climatic anomalies."},{"title":"toltec-civilization","slug":"toltec-civilization","url":"/categories/ancient-civilizations-secrets/toltec-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Toltec constructions dedicated to Kukulkan shaped architectural and ritual practices for centuries in Mesoamerica."},{"title":"zapotec-civilization","slug":"zapotec-civilization","url":"/categories/ancient-civilizations-secrets/zapotec-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Zapotec temples were precisely aligned to track solar events, guiding agriculture and rituals."},{"title":"etruscan-civilization","slug":"etruscan-civilization","url":"/categories/ancient-civilizations-secrets/etruscan-civilization/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":50,"factPreview":"Etruscans used kernos vessels in religious ceremonies, reflecting complex ritual symbolism."},{"title":"carthaginian-empire","slug":"carthaginian-empire","url":"/categories/ancient-civilizations-secrets/carthaginian-empire/","color":"#ec0b1e","category":"ancient-civilizations-secrets","factCount":30,"factPreview":"Carthage industrialized salt extraction to support trade and preservation."}];
let currentSort="alpha";

function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=> i>0 && small.includes(w)? w : w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function createCard(item){
  const div=document.createElement('div');
  div.className='card';
  div.dataset.title=(item.title||'').toLowerCase();
  div.dataset.preview=item.factPreview||'No preview available';
  div.dataset.factcount=item.factCount||0;
  div.style.setProperty('--category-color', item.color||'#ff5722');

  div.innerHTML=`
    <a href="${item.url}">${prettyName(item.title)}</a>
    <div class="badge">Facts: ${item.factCount||1}</div>
  `;

  div.addEventListener('mouseenter',showTooltip);
  div.addEventListener('mousemove',moveTooltip);
  div.addEventListener('mouseleave',hideTooltip);

  return div;
}

function populateGrid(items){
  const container=document.getElementById('items-grid');
  container.innerHTML='';

  if(currentSort==="alpha"){
    items.sort((a,b)=>a.title.localeCompare(b.title));
  }else{
    items.sort((a,b)=>(b.factCount||0)-(a.factCount||0));
  }

  let lastLetter='';
  items.forEach((item,i)=>{
    if(currentSort==="alpha"){
      const first=item.title[0].toUpperCase();
      if(first!==lastLetter){
        const header=document.createElement('div');
        header.className='section-header';
        header.textContent=first;
        container.appendChild(header);
        lastLetter=first;
      }
    }
    const card=createCard(item);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*25);
  });

  const letters=[...new Set(items.map(it=>it.title[0].toUpperCase()))].sort();
  const quickJump=document.getElementById('quickJump');
  quickJump.innerHTML='Jump to: '+letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join(' | ');

  quickJump.querySelectorAll('a').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const letter=a.dataset.letter;
      const target=[...container.children].find(el=>el.textContent.startsWith(letter));
      if(target) target.scrollIntoView({behavior:'smooth'});
    };
  });

  const total=items.reduce((sum,i)=>sum+(i.factCount||0),0);
  document.getElementById('totalFacts').innerHTML=
    `<strong>Total Facts:</strong> ${total}`;
}

function filterCards(){
  const query=document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.dataset.title.includes(query)?'block':'none';
  });
}

function showTooltip(e){
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = this.dataset.preview;
  tooltip.style.opacity = 1;
  moveTooltip(e);
}

function moveTooltip(e){
  const tooltip = document.getElementById('tooltip');
  const offsetX = 10; // horizontal offset from cursor
  const offsetY = 20; // vertical offset from cursor

  let left = e.clientX + offsetX;
  let top = e.clientY + offsetY;

  // prevent tooltip from going off right/bottom edge
  const rect = tooltip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip(){
  const tooltip = document.getElementById('tooltip');
  tooltip.style.opacity = 0;
}


document.getElementById('sortToggle').onclick=()=>{
  currentSort=currentSort==="alpha"?"facts":"alpha";
  document.getElementById('sortToggle').textContent=
    currentSort==="alpha"?"Sort: A–Z":"Sort: Most Facts";
  populateGrid(ITEMS);
};

document.getElementById('darkToggle').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode',
    document.body.classList.contains('dark'));
};

if(localStorage.getItem('darkMode')==="true"){
  document.body.classList.add('dark');
}

window.addEventListener('scroll',()=>{
  document.getElementById('back-to-top').style.opacity=
    window.scrollY>300?1:0;
});

populateGrid(ITEMS);
</script>
