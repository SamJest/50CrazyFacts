/**************************************************
 UTIL — Pretty name
**************************************************/
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=>
      i>0 && small.includes(w)
        ? w
        : w.charAt(0).toUpperCase()+w.slice(1)
    )
    .join(' ');
}

/**************************************************
 GLOBAL REACTION SYNC
**************************************************/
function getFactReactionTotal(subject, slug){

  const keyPrefix = `reactions_`;

  let total = 0;

  for(let i=0;i<localStorage.length;i++){

    const key = localStorage.key(i);

    if(
      key.includes(`_${subject.toLowerCase()}_${slug.toLowerCase()}`)
    ){

      const data =
        JSON.parse(localStorage.getItem(key)) || {};

      total +=
        (data.mindblown||0) +
        (data.interesting||0) +
        (data.lol||0) +
        (data.whoa||0);

    }

  }

  return total;

}

/**************************************************
 CREATE CARD
**************************************************/
function createCard(subject){

  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.slug = subject.slug;
  div.style.setProperty(
    '--category-color',
    subject.color || '#ff5722'
  );

  const reactionsTotal =
    getFactReactionTotal(
      "Nfts",
      subject.slug
    );

  div.innerHTML = `
    <a href="${subject.url}">
      ${prettyName(subject.title)}
    </a>
    <div class="meta">
      <span class="badge">
        Facts: ${subject.factCount || 1}
      </span>
      <span class="badge">
        Reactions: ${reactionsTotal}
      </span>
    </div>
  `;

  return div;
}

/**************************************************
 POPULATE GRID
**************************************************/
function populateGrid(subjects){

  const container =
    document.getElementById('subjects-grid');

  container.innerHTML = '';

  subjects.forEach((s,i)=>{

    const card = createCard(s);

    container.appendChild(card);

    setTimeout(
      ()=>card.classList.add('loaded'),
      i*50
    );

  });

}

/**************************************************
 INIT
**************************************************/
if(typeof SUBJECTS !== 'undefined'){
  populateGrid(SUBJECTS);
}
