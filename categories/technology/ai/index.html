/* --- LOCALSTORAGE KEYS --- */
function reactionKey(slug, key){ return `reaction_${slug}_${key}`; }

/* --- RANDOM INCREMENT --- */
function scheduleRandomIncrement(fact, key, intervalRange=[3,20]) {
  const minMs = intervalRange[0]*60*1000;
  const maxMs = intervalRange[1]*60*1000;
  function tick(){
    const stored = parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || 0;
    localStorage.setItem(reactionKey(fact.slug,key), stored+1);
    updateFactCard(fact);
    setTimeout(tick, Math.random()*(maxMs-minMs)+minMs);
  }
  setTimeout(tick, Math.random()*(maxMs-minMs)+minMs);
}

/* --- CREATE CARD --- */
function createCard(fact){
  const div = document.createElement('div');
  div.className='card';
  div.style.setProperty('--category-color', fact.color || '#ff5722');
  div.dataset.slug = fact.slug;
  
  const counts = {};
  Object.keys(fact.reactions).forEach(key=>{
    counts[key] = parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || fact.reactions[key] || 0;
    scheduleRandomIncrement(fact,key);
  });
  
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  
  div.innerHTML=`
    <a href="${fact.url}">${fact.title}</a>
    <div class="reaction-count">👍 ${total.toLocaleString()}</div>
  `;
  
  div.counts = counts;
  div.totalReactions = total;
  
  return div;
}

/* --- UPDATE CARD --- */
function updateFactCard(fact){
  const card = document.querySelector(`.card[data-slug="${fact.slug}"]`);
  if(!card) return;
  const counts = {};
  Object.keys(fact.reactions).forEach(key=>{
    counts[key] = parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || fact.reactions[key] || 0;
  });
  card.counts = counts;
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  card.totalReactions = total;
  card.querySelector('.reaction-count').textContent = `👍 ${total.toLocaleString()}`;
  updateHeaderTotals();
}

/* --- POPULATE GRID --- */
function populateGrid(){
  const container = document.getElementById('subject-grid');
  container.innerHTML='';
  FACTS.forEach((f,i)=>{
    const card = createCard(f);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'), i*40);
  });
}

/* --- HEADER TOTALS --- */
function updateHeaderTotals(){
  const factCount = FACTS.length;
  const totalReactions = Array.from(document.querySelectorAll('.card'))
    .reduce((sum, c)=>sum+c.totalReactions,0);
  document.getElementById('factCount').textContent = factCount;
  document.getElementById('reactionCount').textContent = totalReactions.toLocaleString();
}

  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=>{
      const pool = Array.from(document.querySelectorAll('.card')).filter(c=>c!==card);
      if(!pool.length) return;
      const next = pool[Math.floor(Math.random()*pool.length)];
      document.getElementById('momentumTitle').textContent = next.querySelector('a').textContent;
      document.getElementById('momentumLink').href = next.querySelector('a').href;
      document.getElementById('momentum-box').style.display='block';
    });
  });
}

/* --- BACK TO TOP --- */
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll',()=>{ backToTop.style.display = window.scrollY>400?'block':'none'; });
backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* --- INIT --- */
populateGrid();
setupMomentum();
updateHeaderTotals();

</script>
</body>
</html>
