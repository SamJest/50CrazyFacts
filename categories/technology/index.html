<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technology</title>

<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<style>
body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; color:#222; scroll-behavior: smooth; }
header { text-align: center; padding: 60px 20px 30px; background: linear-gradient(135deg,#222,#333); color:white; }
header h1 { font-size: 2.8em; margin: 0 0 10px; }
header p { font-size: 1.2em; opacity: 0.9; max-width: 700px; margin: 0 auto; line-height: 1.4; }

.grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin:30px 20px; }

.card { 
  background: white; 
  padding: 20px; 
  border-radius: 16px; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
  flex: 1 1 280px; 
  text-align: center; 
  position: relative; 
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease; 
  cursor: pointer; 
}
.card a { 
  display: block; 
  font-weight:700; 
  color:#222; 
  text-decoration:none; 
  margin-bottom:10px; 
  font-size:1.2em; 
  transition: color 0.2s; 
}
.card:hover { 
  transform: translateY(-6px); 
  box-shadow: 0 0 0 2 var(--category-color,#ff5722), 0 12px 28px rgba(0,0,0,0.12); 
}
.card:hover a { color: var(--category-color,#ff5722); }

.badge { 
  display:inline-block; 
  padding:2px 6px; 
  margin:0 2px; 
  background:#eee; 
  border-radius:4px; 
  font-size:.75em; 
  transition: all 0.2s; 
}
.card:hover .badge { background: var(--category-color,#ff5722); color:white; }

.meta { font-size: 0.85em; color:#555; margin-top:6px; }

@media(max-width:600px){ 
  .grid{flex-direction:column;align-items:center;} 
  .card{flex:1 1 100%;} 
}
</style>
</head>
<body>

<header>
  <h1>Technology</h1>
  <p>Explore all subjects in the Technology category.</p>
</header>

<section id="subjects-grid" class="grid">
  
        <div class="card" style="--category-color:#ff5722">
          <a href="/categories/technology/cyber-security/index.html">cyber-security</a>
          <div class="meta">
            <span class="badge">0 facts</span>
            
            <span class="badge">0 reactions</span>
          </div>
        </div>
      
        <div class="card" style="--category-color:#ff5722">
          <a href="/categories/technology/phishing/index.html">phishing</a>
          <div class="meta">
            <span class="badge">0 facts</span>
            
            <span class="badge">0 reactions</span>
          </div>
        </div>
      
        <div class="card" style="--category-color:#ff5722">
          <a href="/categories/technology/vr-gaming/index.html">vr-gaming</a>
          <div class="meta">
            <span class="badge">0 facts</span>
            
            <span class="badge">0 reactions</span>
          </div>
        </div>
      
</section>

</body>
</html>
