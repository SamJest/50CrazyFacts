/* --- LOCALSTORAGE KEYS --- */
function reactionKey(factSlug,key){ return `reaction_${factSlug}_${key}`; }

/* --- RANDOM INCREMENT --- */
function scheduleRandomIncrement(fact,key,intervalRange=[3,20]){
  const minMs = intervalRange[0]*60*1000;
  const maxMs = intervalRange[1]*60*1000;
  function tick(){
    const stored = parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || 0;
    localStorage.setItem(reactionKey(fact.slug,key), stored+1);
    updateSubjectCard(fact.subjectSlug);
    setTimeout(tick, Math.random()*(maxMs-minMs)+minMs);
  }
  setTimeout(tick, Math.random()*(maxMs-minMs)+minMs);
}

/* --- CREATE CARD --- */
function createCard(subject){
  const div = document.createElement('div');
  div.className='card';
  div.style.setProperty('--category-color', subject.color || '#ff5722');
  div.dataset.slug = subject.slug;

  // Aggregate initial reactions for this subject
  let totalReactions = 0;
  subject.facts.forEach(fact=>{
    Object.keys(fact.reactions).forEach(key=>{
      const stored = parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || fact.reactions[key] || 0;
      totalReactions += stored;
      scheduleRandomIncrement(fact,key);
    });
  });

  div.innerHTML=`
    <a href="${subject.url}">${subject.title}</a>
    <div class="meta">
      <span class="badge">Facts: ${subject.facts.length}</span>
      <span class="badge reaction-count">Reactions: ${totalReactions.toLocaleString()}</span>
    </div>
  `;
  return div;
}

/* --- UPDATE CARD --- */
function updateSubjectCard(subjectSlug){
  const card = document.querySelector(`.card[data-slug="${subjectSlug}"]`);
  if(!card) return;
  const subject = SUBJECTS.find(s=>s.slug===subjectSlug);
  let total = 0;
  subject.facts.forEach(fact=>{
    Object.keys(fact.reactions).forEach(key=>{
      total += parseInt(localStorage.getItem(reactionKey(fact.slug,key))) || fact.reactions[key] || 0;
    });
  });
  card.querySelector('.reaction-count').textContent = `Reactions: ${total.toLocaleString()}`;
}

/* --- POPULATE GRID --- */
function populateGrid(){
  const container = document.getElementById('subjects-grid');
  container.innerHTML='';
  SUBJECTS.forEach((s,i)=>{
    const card = createCard(s);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('loaded'),i*40);
  });
}

/* --- MOMENTUM --- */
function setupMomentum(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=>{
      const pool = Array.from(document.querySelectorAll('.card')).filter(c=>c!==card);
      if(!pool.length) return;
      const next = pool[Math.floor(Math.random()*pool.length)];
      document.getElementById('momentumTitle').textContent = next.querySelector('a').textContent;
      document.getElementById('momentumLink').href = next.querySelector('a').href;
      document.getElementById('momentum-box').style.display='block';
    });
  });
}

/* --- BACK TO TOP --- */
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll',()=>{ backToTop.style.display = window.scrollY>400?'block':'none'; });
backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* --- INIT --- */
populateGrid();
setupMomentum();
</script>
