<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 Crazy Facts</title>
<meta name="description" content="The internet’s most addictive collection of crazy, weird, and unbelievable facts.">

<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<style>

/* GLOBAL */
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#222;
  overflow-x:hidden;
  animation:pageFade .6s ease;
}
@keyframes pageFade{from{opacity:0}to{opacity:1}}

html{scroll-behavior:smooth}

/* HEADER */
.site-bar{
  background:#111;
  color:#fff;
  padding:14px 20px;
  font-size:1.4em;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.site-bar a{color:#e91e63;text-decoration:none;font-size:.9em}

#darkToggle{
  margin-left:15px;
  background:none;
  border:1px solid #e91e63;
  color:#e91e63;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
}

.nav-strip{
  display:flex;
  gap:18px;
  background:#222;
  padding:10px 20px;
}
.nav-strip a{
  color:#fff;
  text-decoration:none;
  font-size:.9em;
  font-weight:bold;
  opacity:.85;
}
.nav-strip a:hover{opacity:1}

/* HERO */
.hero{
  background:linear-gradient(270deg,#e91e63,#ff5722,#ff9800);
  background-size:600% 600%;
  animation:gradientMove 12s ease infinite;
  color:#fff;
  padding:60px 20px 120px;
  text-align:center;
  position:relative;
}
@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.hero h1{margin:0;font-size:3em}
.hero p{margin-top:12px;font-size:1.2em}

.hero-cards-container{
  position:relative;
  max-width:900px;
  height:280px;
  margin:50px auto 0;
}

.hero-card{
  position:absolute;
  inset:0;
  margin:auto;
  max-width:600px;
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(8px);
  color:#222;
  padding:26px;
  border-radius:20px;
  box-shadow:0 14px 38px rgba(0,0,0,.18);
  text-align:left;
  opacity:0;
  pointer-events:none;
  transform:translateY(10px);
  transition:.6s ease;
}

.hero-card.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.hero-btn{
  display:inline-block;
  padding:12px 26px;
  background:#e91e63;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}

/* pulse */
@keyframes heroPulse{
  0%{box-shadow:0 0 0 0 rgba(233,30,99,.6)}
  70%{box-shadow:0 0 0 14px rgba(233,30,99,0)}
  100%{box-shadow:0 0 0 0 rgba(233,30,99,0)}
}
.hero-card.show .hero-btn{
  animation:heroPulse 2s ease 8s infinite;
}

/* STATS GLASS */
.stats{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:24px;
  margin:-60px auto 40px;
  max-width:900px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(14px);
  border-radius:24px;
  box-shadow:0 14px 38px rgba(0,0,0,.1);
}
.stat{text-align:center}
.stat-number{font-size:1.5em;font-weight:bold;color:#e91e63}

/* SECTIONS */
.section{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
  scroll-margin-top:80px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:22px;
}

/* CARDS */
.card{
  position:relative;
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
  opacity:0;
  transform:translateY(20px);
  overflow:hidden;
}
.card.loaded{
  animation:cardFade .6s ease forwards;
}
@keyframes cardFade{
  to{opacity:1;transform:translateY(0)}
}
.card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* animated accent */
.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  height:4px;
  width:100%;
  background:linear-gradient(270deg,#e91e63,#ff5722,#ff9800,#e91e63);
  background-size:300% 300%;
  animation:cardAccent 6s ease infinite;
}
@keyframes cardAccent{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* PREMIUM BADGES */
.badge{
  display:inline-block;
  padding:5px 12px;
  border-radius:999px;
  font-size:.72em;
  font-weight:600;
  margin-top:10px;
  margin-right:6px;
  color:#fff;
}
.badge:nth-child(1){
  background:linear-gradient(135deg,#e91e63,#ff4081);
}
.badge:nth-child(2){
  background:linear-gradient(135deg,#ff9800,#ff5722);
}

/* DARK MODE */
body.dark{
  background:#121212;
  color:#eee;
}
body.dark .card,
body.dark .stats,
body.dark .hero-card{
  background:#1e1e1e;
  color:#eee;
}
body.dark .site-bar{background:#000}

#backToTop{
  position:fixed;
  bottom:120px;
  right:30px;
  padding:12px 18px;
  background:#e91e63;
  color:#fff;
  border:none;
  border-radius:30px;
  display:none;
  z-index:1000;
}

</style>
</head>

<body>

<div class="site-bar">
  50CrazyFacts
  <div>
    <a href="/categories/index.html">Browse All Categories</a>
    <button id="darkToggle">🌙</button>
  </div>
</div>

<div class="nav-strip">
  <a href="#featured">Featured</a>
  <a href="#latest">Latest</a>
  <a href="#random">Random</a>
</div>

<div class="hero">
  <h1>Learn Fast. Share Faster.</h1>
  <p>Mind-Blowing Facts, Every Day.</p>
  <div class="hero-cards-container"></div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-number">3281</div><div>Facts</div></div>
  <div class="stat"><div class="stat-number">67</div><div>Subjects</div></div>
  <div class="stat"><div class="stat-number">5</div><div>Categories</div></div>
</div>

<div class="section" id="featured">
  <h2>🔥 Featured Facts</h2>
  <div class="grid" id="featuredGrid"></div>
</div>

<div class="section" id="latest">
  <h2>🆕 Latest Facts</h2>
  <div class="grid" id="latestGrid"></div>
</div>

<div class="section" id="random">
  <h2>🎲 Random Discoveries</h2>
  <div class="grid" id="randomGrid"></div>
</div>

<button id="backToTop">↑</button>

<script>
document.addEventListener('DOMContentLoaded', async () => {

let homeData={heroPool:[],featuredPool:[],latest:[],randomPool:[]};
try{
 const res=await fetch('/home.json');
 if(res.ok) homeData=await res.json();
}catch(e){}

const {heroPool=[],featuredPool=[],latest=[],randomPool=[]}=homeData;

/* CARD BUILDER */
function buildCard(f){
 const url=`/categories/${f.category}/${f.subject}/${f.SLUG}.html`;
 const div=document.createElement('div');
 div.className='card';
 div.innerHTML=`
   <a href="${url}" style="text-decoration:none;color:inherit;">
     <h3>${f.SEO_TITLE||''}</h3>
     <p>${f.FACT_HOOK||''}</p>
     <span class="badge">${f.category||''}</span>
     <span class="badge">${f.subject||''}</span>
   </a>
 `;
 setTimeout(()=>div.classList.add('loaded'),Math.random()*200);

 const link=div.querySelector('a');
 link.addEventListener('mouseenter',()=>{
   const pre=document.createElement('link');
   pre.rel='prefetch';
   pre.href=link.href;
   document.head.appendChild(pre);
 });

 return div;
}

/* HERO */
const heroContainer=document.querySelector('.hero-cards-container');
heroPool.slice(0,8).forEach(f=>{
 const div=document.createElement('div');
 div.className='hero-card';
 div.innerHTML=`
   <h2>${f.SEO_TITLE||''}</h2>
   <p>${f.FACT_HOOK||''}</p>
   <span class="badge">${f.category||''}</span>
   <span class="badge">${f.subject||''}</span>
   <br><br>
   <a href="/categories/${f.category}/${f.subject}/${f.SLUG}.html" class="hero-btn">Read More</a>
 `;
 heroContainer.appendChild(div);
});
const heroCards=document.querySelectorAll('.hero-card');
let heroIndex=0;
if(heroCards.length){
 heroCards[0].classList.add('show');
 setInterval(()=>{
   heroCards[heroIndex].classList.remove('show');
   heroIndex=(heroIndex+1)%heroCards.length;
   heroCards[heroIndex].classList.add('show');
 },5000);
}

/* GRID LOAD */
function loadGrid(gridId,pool){
 const grid=document.getElementById(gridId);
 pool.slice(0,24).forEach(f=>grid.appendChild(buildCard(f)));
}
loadGrid('featuredGrid',featuredPool);
loadGrid('latestGrid',latest);
loadGrid('randomGrid',randomPool);

/* BACK TO TOP */
const backBtn=document.getElementById('backToTop');
window.addEventListener('scroll',()=>{
 backBtn.style.display=window.scrollY>400?'block':'none';
});
backBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* DARK MODE */
const darkToggle=document.getElementById('darkToggle');
if(localStorage.getItem('darkMode')==='true'){
 document.body.classList.add('dark');
}
darkToggle.addEventListener('click',()=>{
 document.body.classList.toggle('dark');
 localStorage.setItem('darkMode',
  document.body.classList.contains('dark'));
});

});
</script>

</body>
</html>
