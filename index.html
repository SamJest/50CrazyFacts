<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 Crazy Facts</title>

<link rel="icon" href="/favicon.ico">


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XJEGWMGS"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-V2XJEGWMGS');
</script>


<style>
body { font-family:Arial,sans-serif; margin:0; background:#f7f7f7; }
header { background:#ff5722; color:white; padding:40px; text-align:center; }
h1 { margin:0; font-size:3em; }

.main { display:flex; flex-wrap:wrap; justify-content:center; padding:20px; }

.card {
  background:white;
  padding:15px;
  margin:10px;
  width:220px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  transition:.25s;
}

.card a {
  text-decoration:none;
  font-weight:bold;
  color:#ff5722;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.random-fact {
  background:#fff9f2;
  max-width:820px;
  margin:40px auto;
  padding:26px 30px;
  border-radius:12px;
  border-left:6px solid #ff5722;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
  text-align:center;
}

.random-fact h2 {
  margin:0 0 10px 0;
  font-size:1.7em;
  color:#222;
  font-weight:700;
}

.reactions {
  margin-top:10px;
  font-size:0.85em;
  color:#555;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.reactions span {
  display:flex;
  align-items:center;
  gap:4px;
}

.search-container {
  max-width:700px;
  margin:40px auto;
  text-align:center;
}

#searchBox {
  width:100%;
  padding:12px;
  font-size:1.1em;
  border-radius:8px;
  border:1px solid #ccc;
}

.section-title {
  text-align:center;
  margin-top:50px;
}

.badge {
  background:#eee;
  padding:3px 9px;
  border-radius:20px;
  font-size:.7em;
  white-space:nowrap;
}

.scroll-cta {
  text-align:center;
  margin:60px 0;
}

.scroll-cta a {
  font-weight:bold;
  color:#ff5722;
  text-decoration:none;
  font-size:1.1em;
}
</style>
</head>

<body>

<header>
  <h1>50 Crazy Facts</h1>
  <p>One strange fact can completely change how you see the world.</p>
  <p style="margin-top:15px;">
    <a href="categories/index.html"
       style="color:white;font-weight:bold;text-decoration:underline;">
      Browse all categories →
    </a>
  </p>
</header>

<div class="search-container">
  <input type="text" id="searchBox" placeholder="Search for a fact...">
  <p style="margin-top:12px;">
    <a href="search.html"
       style="color:#ff5722;font-weight:bold;text-decoration:underline;">
      Go to full search page →
    </a>
  </p>
</div>

<!-- HERO -->
<div id="heroFact"></div>

<h2 class="section-title">🆕 Latest Facts</h2>
<div class="main" id="latestFactsContainer"></div>

<h2 class="section-title">🎲 Discover More</h2>
<div class="main" id="randomFactsContainer"></div>

<div class="scroll-cta" id="bottomCta" style="display:none;">
  <a href="random.html">Show me another crazy fact →</a>
</div>

<script>
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=>i>0&&small.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

function factCard(f){
  return `
    <div class="card">
      <a href="${f.url}">${humanize(f.title)}</a>
      <div class="meta"
           style="margin-top:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;">
        <span class="badge">${prettyName(f.category)}</span>
        <span class="badge">${prettyName(f.subject)}</span>
      </div>
      <div class="reactions">
        <span>🤯 ${f.reactions?.mind_blown || 0}</span>
        <span>😲 ${f.reactions?.shocked || 0}</span>
        <span>😮 ${f.reactions?.wow || 0}</span>
        <span>🤓 ${f.reactions?.interesting || 0}</span>
      </div>
    </div>
  `;
}

fetch('home.json')
  .then(r => r.json())
  .then(home => {

    /* HERO */
    const hero = home.hero[Math.floor(Math.random() * home.hero.length)];

    document.getElementById('heroFact').innerHTML = `
      <div class="random-fact">
        <div style="font-size:.8em;color:#ff5722;font-weight:bold;margin-bottom:6px;">
          🔥 Today’s Crazy Fact
        </div>
        <h2>
          <a href="${hero.url}" style="color:#222;text-decoration:none">
            ${humanize(hero.title)}
          </a>
        </h2>
        <div class="meta" style="justify-content:center;margin-bottom:6px">
          <span class="badge">${prettyName(hero.category)}</span>
          <span class="badge">${prettyName(hero.subject)}</span>
        </div>
        <div class="reactions">
          <span>🤯 ${hero.reactions?.mind_blown || 0}</span>
          <span>😲 ${hero.reactions?.shocked || 0}</span>
          <span>😮 ${hero.reactions?.wow || 0}</span>
          <span>🤓 ${hero.reactions?.interesting || 0}</span>
        </div>
        <p style="font-size:.75em;color:#777;margin-top:8px;">
          How did this fact make you feel?
        </p>
      </div>
    `;

    home.latest.forEach(f =>
      latestFactsContainer.insertAdjacentHTML('beforeend', factCard(f))
    );

    home.random.forEach(f =>
      randomFactsContainer.insertAdjacentHTML('beforeend', factCard(f))
    );
  });

/* Show bottom CTA after scrolling */
window.addEventListener('scroll', () => {
  if (window.scrollY > window.innerHeight * 0.6) {
    document.getElementById('bottomCta').style.display = 'block';
  }
});

document.getElementById("searchBox").addEventListener("keypress", e => {
  if (e.key === "Enter") {
    window.location.href = "search.html?q=" + encodeURIComponent(e.target.value);
  }
});
</script>

</body>
</html>
