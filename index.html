<script>
// Utility: pretty format for badges
function prettyName(slug){
  const small=['and','or','the','in','of','to','for'];
  return (slug||'')
    .replace(/-/g,' ')
    .split(' ')
    .map((w,i)=>i>0&&small.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}

// Generate a card element
function createCard(f) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.category = f.category;
  div.dataset.subject = f.subject;
  div.dataset.fact = f.slug;
  div.style.setProperty('--category-color', f.color || '#555');

  div.innerHTML = `
    <a href="${f.url}">${prettyName(f.title)}</a>
    <div class="meta">
      <span class="badge">${prettyName(f.category)}</span>
      <span class="badge">${prettyName(f.subject)}</span>
    </div>
    <div class="reactions">
      <span data-reaction="mind_blown">🤯 <span class="count">0</span></span>
      <span data-reaction="shocked">😲 <span class="count">0</span></span>
      <span data-reaction="wow">😮 <span class="count">0</span></span>
      <span data-reaction="interesting">🤓 <span class="count">0</span></span>
    </div>
  `;
  return div;
}

// Populate sections
function populateSection(sectionId, facts) {
  const container = document.getElementById(sectionId);
  container.innerHTML = '';
  facts.forEach(f => container.appendChild(createCard(f)));
}

// --- Wait for HOME_FACTS to be available ---
if (typeof HOME_FACTS !== 'undefined') {
  populateSection('hero-grid', HOME_FACTS.hero);
  populateSection('latest-grid', HOME_FACTS.latest);
  populateSection('random-grid', HOME_FACTS.random);
}
