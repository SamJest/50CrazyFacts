<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>50 Crazy Facts</title>

<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-V2XJEGWMGS"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-V2XJEGWMGS');
</script>

<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
header { background: #ff5722; color: white; padding: 40px; text-align: center; }
h1 { margin: 0; font-size: 3em; }
.main { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
.card { background: white; padding: 15px; margin: 10px; width: 220px; text-align: center; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.card a { text-decoration: none; font-weight: bold; color: #ff5722; }
.card a:hover { text-decoration: underline; }
.random-fact { background: #fff9f2; max-width: 800px; margin: 40px auto; padding: 24px 28px; border-radius: 12px; border-left: 6px solid #ff5722; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; font-family: Arial,sans-serif; }
.random-fact h2 { margin: 0 0 12px 0; font-size: 1.6em; color: #222; font-weight: 700; text-transform: capitalize; }
.random-fact p { font-size: 1.05em; color: #444; line-height: 1.5; margin-top: 8px; }
.random-fact .share-buttons { margin-top: 16px; display: flex; justify-content: center; gap: 12px; }
.random-fact .share-buttons button { background: #ff5722; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
.random-fact .share-buttons button:hover { background: #e64a19; }
</style>
</head>
<body>
<header>
<h1>50 Crazy Facts</h1>
<p>Discover mind-blowing facts every day</p>
<p style="margin-top:15px;"><a href="categories/index.html" style="color:white;font-weight:bold;text-decoration:underline;">Browse all categories →</a></p>
</header>
<div class="search-container">
<input type="text" id="searchBox" placeholder="Search for a fact...">
<ul id="results"></ul>
</div>
<div class="random-fact" id="heroFact"></div>
<div class="main" id="randomFactsContainer"></div>
<div class="main" id="categoriesContainer"></div>
<script>
let facts = [];
let categories = [];
let CATEGORY_DISPLAY_NAME = {};

fetch('search.json').then(r=>r.json()).then(data=>{
  facts = data;

  // Build slug -> display name map
  data.forEach(f=>CATEGORY_DISPLAY_NAME[f[6]]=f[6]);

  // Hero fact
  const heroFact = facts[Math.floor(Math.random()*facts.length)];
  document.getElementById('heroFact').innerHTML = `
    <div class="random-fact">
      <h2>${heroFact[0]}</h2>
      <p>${heroFact[1]}</p>
      <div class="share-buttons">
        <button onclick="window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('${heroFact[0]} - ${heroFact[1]}'))">Tweet</button>
        <button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(window.location.href))">Share</button>
      </div>
    </div>
  `;

  // 6 random facts
  const shuffled = facts.sort(()=>0.5-Math.random());
  const randomSix = shuffled.slice(0,6);
  const randomFactsContainer = document.getElementById('randomFactsContainer');
  randomFactsContainer.innerHTML = randomSix.map(f=>`
    <div class="card"><a href="categories/${f[6]}/${f[7]}/${f[0].toLowerCase().replace(/[^a-z0-9]+/g,'-')}.html">${f[0]}</a></div>
  `).join('');

  // 3 random categories
  const uniqueCats = [...new Set(data.map(f=>f[6]))];
  const catShuffled = uniqueCats.sort(()=>0.5-Math.random()).slice(0,3);
  const categoriesContainer = document.getElementById('categoriesContainer');
  categoriesContainer.innerHTML = catShuffled.map(c=>`<div class="card"><a href="categories/${c}/index.html">${c}</a></div>`).join('');
});

// Search functionality
document.getElementById('searchBox').addEventListener('input', function(){
  const q = this.value.toLowerCase();
  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = facts.filter(f=>f.join(' ').toLowerCase().includes(q)).slice(0,20)
    .map(f=>`<li><a href="categories/${f[6]}/${f[7]}/${f[0].toLowerCase().replace(/[^a-z0-9]+/g,'-')}.html">${f[0]}</a></li>`).join('');
});
</script>
</body>
</html>
