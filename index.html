<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
header { background: #ff5722; color: white; padding: 40px; text-align: center; }
h1 { margin: 0; font-size: 3em; }
.search-container { max-width: 600px; margin: 30px auto; text-align: center; }
#searchBox { width: 100%; padding: 12px; font-size: 1em; }
#results { list-style: none; padding: 0; margin-top: 10px; }
#results li { background: white; margin: 5px 0; padding: 10px; border-radius: 5px; }
#results a { text-decoration: none; color: #ff5722; font-weight: bold; }

.random-fact {
  background: #fdf7f3;
  max-width: 800px;
  margin: 40px auto;
  padding: 24px 28px;
  border-radius: 12px;
  border-left: 6px solid #ff5722;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.random-fact h2 {
  margin: 0 0 8px 0;
  font-size: 1.4em;
  color: #222;
  font-weight: 700;
}

.random-fact p {
  font-size: 1.05em;
  color: #444;
  line-height: 1.5;
}

.ad-placeholder {
  background: #e0e0e0;
  text-align: center;
  padding: 20px;
  margin: 30px auto;
  max-width: 800px;
  border-radius: 10px;
  font-weight: bold;
}

.main { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
.card {
  background: white;
  padding: 15px;
  margin: 10px;
  width: 220px;
  text-align: center;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.card a { text-decoration: none; font-weight: bold; color: #ff5722; }
.card a:hover { text-decoration: underline; }

.category-btn {
  display:inline-block;
  background:#ff5722;
  color:white;
  padding:10px 15px;
  margin:5px;
  border-radius:5px;
  text-decoration:none;
  font-weight:bold;
}
.category-btn:hover { background:#e64a19; }
</style>
</head>
<body>

<header>
  <h1>50 Crazy Facts</h1>
  <p>Discover mind-blowing facts every day</p>
  <p style="margin-top:15px;">
    <a href="categories/index.html"
       style="color:white;font-weight:bold;text-decoration:underline;">
       Browse all categories →
    </a>
  </p>
</header>

<div class="search-container">
  <input type="text" id="searchBox" placeholder="Search for a fact...">
  <ul id="results"></ul>
</div>

<div class="random-fact" id="randomFact">
  <h2>Loading Random Fact…</h2>
  <p></p>
</div>

<div class="ad-placeholder">AD 1</div>

<h2 style="text-align:center; margin-top:40px;">Categories</h2>
<div class="main"><a href="categories/Animals/index.html" class="category-btn">Animals</a><a href="categories/Technology/index.html" class="category-btn">Technology</a></div>

<h2 style="text-align:center; margin-top:40px;">Latest Facts</h2>
<div class="main" id="latestFacts">
    <div class="card">
      <a href="categories/Technology/5G Technology/5g-and-virtual-reality-workspaces.html">
        5G and Virtual Reality Workspaces
      </a>
      <span class="date">2026-01-06</span>
    </div>
  
    <div class="card">
      <a href="categories/Animals/Tarsiers/tarsiers-eyes-are-immobile-but-exceptionally-large.html">
        Tarsiers’ Eyes Are Immobile But Exceptionally Large
      </a>
      <span class="date">2026-01-06</span>
    </div>
  </div>

<div class="ad-placeholder">AD 2</div>

<script>
function toTitleCase(str) {
  return str.replace(/wS*/g, function(txt) {
    return txt.charAt(0).toUpperCase() + txt.substr(1);
  });
}
let data = [];
fetch('search.json')
  .then(r => r.json())
  .then(d => {
    data = d;
    showRandomFact();
  });

document.getElementById('searchBox').addEventListener('input', function () {
  const q = this.value.toLowerCase();
  document.getElementById('results').innerHTML =
    data.filter(r => r.join(' ').toLowerCase().includes(q))
      .slice(0,10)
      .map(r =>
        '<li><a href="categories/' + r[6] + '/' + r[7] + '/' +
        r[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') +
        '.html">' + r[0] + '</a></li>'
      ).join('');
});

function showRandomFact() {
  if (!data.length) return;
  const fact = data[Math.floor(Math.random() * data.length)];
  const url = 'categories/' + fact[6] + '/' + fact[7] + '/' +
              fact[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') +
              '.html';

  document.getElementById('randomFact').innerHTML =
  '<h2><a href="' + url + '">' + fact[0] + '</a></h2>' +
  '<p style="margin-top:10px;">' +
  '<a href="' + url + '" style="color:#ff5722;font-weight:bold;text-decoration:none;">' +
  'Click to read more →</a></p>';
}
</script>

</body>
</html>
